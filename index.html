            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                debugStatus.textContent = "Requesting permission...";
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    debugStatus.textContent = 'Permission: ' + permissionState;
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientationEvent);
                    } else if (sourceSelector) {
                        sourceSelector.value = 'fixed';
                        sourceSelector.dispatchEvent(new Event('change'));
                    }
                }).catch(err => {
                    debugStatus.textContent = 'Error: ' + err.message;
                    console.error(err);
                });
            } else {
                debugStatus.textContent = 'Adding listener directly...';
                window.addEventListener('deviceorientation', handleOrientationEvent);
            }
        }

        function setDefaultGravitySource() {
            const isMobile = 'ontouchstart' in window;
            const orientationPermissionRequired = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
            const selector = document.getElementById('gravitySource');

            if (isMobile && !orientationPermissionRequired) {
                debugStatus.textContent = 'Orientation sensor detected. Activating.';
                selector.value = 'orientation';
                selector.dispatchEvent(new Event('change'));
            } else {
                const reason = orientationPermissionRequired ? 'needs permission' : 'desktop detected';
                debugStatus.textContent = `Orientation ${reason}. Defaulting to slider.`;
                selector.value = 'fixed';
                selector.dispatchEvent(new Event('change'));
            }
        }

        function updateOrientationDebug() {
            debugOrientation.textContent = window.orientation || 0;
        }

        function animate() {
            frameCount++;
            const currentTime = performance.now();
            const deltaTime = currentTime - lastFpsUpdateTime;
            if (deltaTime > 1000) {
                fps = Math.round((frameCount * 1000) / deltaTime);
                if (fpsCounterElement) {
                    fpsCounterElement.textContent = fps;
                }
                frameCount = 0;
                lastFpsUpdateTime = currentTime;
            }
            update();
            draw();
            drawGravityIndicator();
            requestAnimationFrame(animate);
        }

        function setupSlider(id, valueDisplayId, setter, isFloat = true, requiresReset = false) {
            const slider = document.getElementById(id);
            if (!slider) return;
            const display = document.getElementById(valueDisplayId);
            slider.addEventListener('input', e => {
                const value = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value, 10);
                setter(value);
                if (display) {
                    const precision = (id === 'damping' || id === 'breathingRate') ? 3 : (id === 'pointSize' || id === 'maxLineThickness' || id === 'autoAddDelay' || id === 'gravity' || id === 'minShade' || id === 'shiverPropagation' || id === 'shiverEffect' || id === 'shiverDuration' || id === 'imprintShade') ? 2 : 1;
                    display.textContent = isFloat ? value.toFixed(precision) : value;
                }
                if (requiresReset && id !== 'autoAddDelay') {
                    init();
                }
            });
        }

        function setupCheckbox(id, setter, requiresReset = false, dependentControls = []) {
            const checkbox = document.getElementById(id);
            if (!checkbox) return;
            const updateDependents = (checked) => {
                for (const control of dependentControls) {
                    if (control) {
                        control.style.display = checked ? 'block' : 'none';
                    }
                }
            };
            checkbox.addEventListener('change', e => {
                const checked = e.target.checked;
                setter(checked);
                updateDependents(checked);
                if (requiresReset) init();
            });
            updateDependents(checkbox.checked);
        }

        function setupShapeSelector() {
            const e = document.getElementById("creatureShape"),
                t = document.getElementById("pointDensityLabel").parentElement,
                n = document.getElementById("pointDensityLabel"),
                i = document.getElementById("pointDensityValue"),
                a = document.getElementById("pointDensity"),
                d = document.getElementById("letterInputContainer"),
                o = document.getElementById("letterInput");
            e.addEventListener("change", c => {
                creatureShape = c.target.value, d.style.display = "none", t.style.display = "block", "grid" === creatureShape ? (n.childNodes[0].nodeValue = "Points / Side ", a.min = 3, a.max = 15, parseInt(a.value) > 15 && (a.value = 15)) : "letter" === creatureShape && (n.childNodes[0].nodeValue = "Sampling Density ", a.min = 2, a.max = 18, d.style.display = "block"), i.textContent = a.value, pointDensity = parseInt(a.value)
            });
            o.addEventListener("input", () => {
                init()
            })
        }


        function setupGaitSelector() {
            const e = document.getElementById("gaitPattern"),
                t = document.getElementById("seekingFeetControl"),
                n = document.getElementById("waveDelayControl"),
                i = () => {
                    gaitPattern = e.value, t.style.display = "sequential" === gaitPattern ? "block" : "none", n.style.display = "sidewinder" === gaitPattern ? "block" : "none"
                };
            e.addEventListener("change", () => {
                i(), init()
            });
            i()
        }

        function setupTendrilControls() {
            setupSlider("numTendrils", "numTendrilsValue", e => {
                numTendrils = e
            }, false, true);
            setupSlider("tendrilLength", "tendrilLengthValue", e => {
                tendrilLength = e
            }, false, true);
            setupSlider("tendrilQuality", "tendrilQualityValue", e => {
                tendrilQuality = e
            }, true, true);
            setupSlider("tendrilStiffness", "tendrilStiffnessValue", e => {
                tendrilStiffness = e
            });
            const e = document.getElementById("tendrilLengthVariation"),
                t = document.getElementById("tendrilLengthVariationValue");
            e.addEventListener("input", n => {
                const i = parseFloat(n.target.value);
                tendrilLengthVariation = i, t.textContent = (100 * i).toFixed(0) + "%", init()
            });
            setupCheckbox("feetOnTendrils", e => {
                placeFeetOnTendrils = e
            }, true);
            setupCheckbox("shiversOnTendrils", e => {
                shiversOnTendrils = e
            });
        }

        function setupAppearanceControls() {
            const e = document.getElementById("drawMode"),
                t = document.getElementById("pointSizeContainer"),
                n = document.getElementById("letterChoiceContainer"),
                i = document.getElementById("letterChoice"),
                a = () => {
                    drawMode = e.value, t.style.display = "point" === drawMode ? "block" : "none", n.style.display = "letter" === drawMode ? "block" : "none"
                };
            e.addEventListener("change", a);
            i.addEventListener("change", e => {
                letterToDraw = e.target.value
            });
            setupSlider("pointSize", "pointSizeValue", e => {
                pointBaseSize = e
            }, true);
            a()
        }

        function setupPointSizeVariationControl() {
            const slider = document.getElementById('pointSizeVariation');
            const display = document.getElementById('pointSizeVariationValue');
            if (!slider || !display) return;

            slider.addEventListener('input', e => {
                const value = parseFloat(e.target.value);
                pointSizeVariation = value;
                display.textContent = (value * 100).toFixed(0) + '%';
            });

            // Set initial display value on load
            display.textContent = (parseFloat(slider.value) * 100).toFixed(0) + '%';
        }

        function setupToggleControlsButton() {
            const toggleBtn = document.getElementById("toggleControlsBtn");
            const controlsPanel = document.querySelector(".controls");

            if (toggleBtn && controlsPanel) {
                toggleBtn.addEventListener("click", () => {
                    controlsPanel.classList.toggle("hidden");
                    toggleBtn.classList.toggle("is-visible");
                });
            }
        }

        function setupPropagationSpeedControl() {
            const slider = document.getElementById('shiverPropagationSpeed');
            const display = document.getElementById('shiverPropagationSpeedValue');

            function updateSpeed(sliderValue) {
                const v = parseInt(sliderValue, 10);
                let speed;
                if (v >= 0) {
                    speed = v + 1;
                } else {
                    speed = 1 / (Math.abs(v) + 1);
                }
                shiverPropagationSpeed = speed;
                if (display) {
                    display.textContent = speed.toFixed(2);
                }
            }

            slider.addEventListener('input', e => {
                updateSpeed(e.target.value);
            });

            // Set initial value
            updateSpeed(slider.value);
        }

        function printAllCreatures() {
            for (const creature of creatures) {
                if (!creature.isDead) {
                    creature.printToBackground();
                }
            }
        }

        function setupInteractionHandlers() {
            const addBtn = document.getElementById("addCreatureBtn");
            const titleH1 = document.querySelector('#title-container h1');

            if (addBtn) {
                addBtn.addEventListener("click", addCreature);
            }

            if (titleH1) {
                const startPrinting = (e) => {
                    e.preventDefault();
                    if (continuousPrintIntervalId !== null) return;
                    printAllCreatures();
                    continuousPrintIntervalId = setInterval(printAllCreatures, printIntervalMs);
                };
                const stopPrinting = () => {
                    if (continuousPrintIntervalId !== null) {
                        clearInterval(continuousPrintIntervalId);
                        continuousPrintIntervalId = null;
                    }
                };

                titleH1.addEventListener('mousedown', startPrinting);
                titleH1.addEventListener('touchstart', startPrinting);

                window.addEventListener('mouseup', stopPrinting);
                window.addEventListener('touchend', stopPrinting);
                titleH1.addEventListener('mouseleave', stopPrinting);
            }

            document.addEventListener("keydown", function (e) {
                if (e.code === "Space" && !e.target.closest("input, select, button")) {
                    e.preventDefault();
                    addCreature();
                }
            });
        }

        function setupEraseButton() {
            const btn = document.getElementById('eraseBtn');
            if (btn) {
                btn.addEventListener('click', resetHistory);
            }
        }

        function randomizeAndRespawn() {
            const rand = (min, max, isFloat = false) => isFloat ? Math.random() * (max - min) + min : Math.floor(Math.random() * (max - min + 1)) + min;

            const updateSlider = (id, value) => {
                const slider = document.getElementById(id);
                if (!slider) return;
                slider.value = value;
                slider.dispatchEvent(new Event('input', {
                    bubbles: true
                }));
            };

            const updateCheckbox = (id, checked) => {
                const checkbox = document.getElementById(id);
                if (!checkbox) return;
                checkbox.checked = checked;
                checkbox.dispatchEvent(new Event('change', {
                    bubbles: true
                }));
            };

            const updateSelect = (id, value) => {
                const select = document.getElementById(id);
                if (!select) return;
                select.value = value;
                select.dispatchEvent(new Event('change', {
                    bubbles: true
                }));
            }

            // Creature Shape
            const shape = Math.random() < 0.5 ? 'grid' : 'letter';
            updateSelect('creatureShape', shape);
            if (shape === 'letter') {
                const chars = '+*#@$%&?';
                document.getElementById('letterInput').value = chars.charAt(rand(0, chars.length - 1));
            }
            updateSlider('pointDensity', rand(5, 18));
            updateSlider('numFeet', rand(2, 12));
            updateSlider('restLength', rand(0.5, 1.2, true));

            // Physics
            updateSlider('stiffness', rand(0.05, 0.3, true));
            updateSlider('damping', rand(0.05, 0.15, true));
            updateSlider('shiverIntensity', rand(-1.5, 1.5, true));
            updateSlider('shiverPropagation', rand(0.85, 1.0, true));
            updateSlider('shiverPropagationSpeed', rand(-10, 5));
            updateSlider('shiverDuration', rand(0.5, 1.0, true));

            // Gait
            const gaits = ['sequential', 'paired', 'sidewinder'];
            updateSelect('gaitPattern', gaits[rand(0, gaits.length - 1)]);
            updateSlider('numSeekingFeet', rand(1, 4));
            updateSlider('stepHeight', rand(20, 80));
            updateSlider('wobbleStrength', rand(10, 50));

            // Appearance
            updateSlider('pointSize', rand(1.0, 4.0, true));
            updateSlider('pointSizeVariation', rand(0.0, 0.8, true));
            updateSlider('maxLineThickness', rand(1.0, 5.0, true));
            updateSlider('minShade', rand(0.0, 0.4, true));

            // Optional Features
            updateCheckbox('enableTendrils', Math.random() < 0.6);
            updateSlider('numTendrils', rand(1, 5));
            updateSlider('tendrilLength', rand(3, 20));
            updateSlider('tendrilStiffness', rand(0.01, 0.2, true));

            updateCheckbox('enableBreathing', Math.random() < 0.8);
            updateSlider('breathingRate', rand(0.002, 0.02, true));
            updateSlider('breathingAmplitude', rand(0.01, 0.2, true));
            updateSlider('breathingOffset', rand(0.8, 1.1, true));

            init();
        }

        function setupRandomizeButtons() {
            const panelBtn = document.getElementById('randomizeBtn');
            if (panelBtn) {
                panelBtn.addEventListener('click', randomizeAndRespawn);
            }
            const shortcutBtn = document.getElementById('randomizeShortcutBtn');
            if (shortcutBtn) {
                shortcutBtn.addEventListener('click', randomizeAndRespawn);
            }
        }

        function handleCopyParameters() {
            const params = {
                creatureShape,
                pointDensity,
                numFeet,
                restLengthFactor,
                useRandomPlacement,
                damping,
                springStiffness,
                gravity,
                shiverIntensityFactor,
                shiverPropagationFactor,
                shiverPropagationSpeed,
                shiverEffectMultiplier,
                shiverDurationFactor,
                numSeekingFeet,
                footCoordinationFactor,
                stepCooldown,
                stepDuration,
                stepHeight,
                wobbleStrength,
                targetAttraction,
                gaitPattern,
                enableTendrils,
                numTendrils,
                tendrilLength,
                tendrilStiffness,
                placeFeetOnTendrils,
                shiversOnTendrils,
                tendrilQuality,
                tendrilLengthVariation,
                drawMode,
                pointBaseSize,
                letterToDraw,
                maxLineThickness,
                pointSizeVariation,
                autoAddDelaySeconds,
                autoMode,
                enableBreathing,
                breathingRate,
                breathingAmplitude,
                breathingOffset,
                pruneUnfootedPoints,
                enableProgressiveAppearance,
                growthSpeed,
                enableAging,
                agingMode,
                lifespanSeconds,
                maxFootsteps,
                deathEffect,
                enableCreatureLimit,
                maxCreatures,
                enablePointLimit,
                maxPoints,
                letterInput: document.getElementById('letterInput').value,
                imprintShade,
                shiverPropagationSpeedSlider: document.getElementById('shiverPropagationSpeed').value
            };
            const paramsString = JSON.stringify(params, null, 2);
            navigator.clipboard.writeText(paramsString).then(() => {
                const btn = document.getElementById('copyParamsBtn');
                if (btn) {
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 1500);
                }
            }).catch(err => {
                console.error('Failed to copy parameters: ', err);
            });
            console.log("Current Parameters:", params);
        }

        function setupCopyButton() {
            const copyBtn = document.getElementById('copyParamsBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', handleCopyParameters);
            }
        }

        function setupBirthControls() {
            setupCheckbox('enableProgressiveAppearance', val => {
                enableProgressiveAppearance = val;
                document.getElementById('progressiveAppearanceControls').style.display = val ? 'block' : 'none';
                init();
            }, false, [document.getElementById('progressiveAppearanceControls')]);
            setupSlider('growthSpeed', 'growthSpeedValue', val => {
                growthSpeed = val;
            }, false, true);
        }

        function setupAgingControls() {
            setupCheckbox('enableAging', val => {
                enableAging = val;
                document.getElementById('agingControlsContainer').style.display = val ? 'block' : 'none';
                init();
            }, false, [document.getElementById('agingControlsContainer')]);
            const mS = document.getElementById('agingMode'),
                lC = document.getElementById('lifespanContainer'),
                mSC = document.getElementById('maxStepsContainer');
            mS.addEventListener('change', () => {
                agingMode = mS.value;
                lC.style.display = (agingMode === 'time') ? 'block' : 'none';
                mSC.style.display = (agingMode === 'steps') ? 'block' : 'none';
                init();
            });
            document.getElementById('deathEffect').addEventListener('change', (e) => {
                deathEffect = e.target.value;
                init();
            });
            lC.style.display = (agingMode === 'time') ? 'block' : 'none';
            mSC.style.display = (agingMode === 'steps') ? 'block' : 'none';
        }

        function setupBreathingControls() {
            const e = document.getElementById("restLength"),
                t = document.getElementById("enableBreathing"),
                n = () => {
                    enableBreathing = t.checked, e.disabled = enableBreathing, document.getElementById("breathingControlsContainer").style.display = enableBreathing ? "block" : "none", enableBreathing || (restLengthFactor = parseFloat(e.value))
                };
            t.addEventListener("change", n);
            setupSlider("breathingRate", "breathingRateValue", e => {
                breathingRate = e
            }, true);
            setupSlider("breathingAmplitude", "breathingAmplitudeValue", e => {
                breathingAmplitude = e
            }, true);
            setupSlider("breathingOffset", "breathingOffsetValue", e => {
                breathingOffset = e
            }, true);
            n()
        }

        function setupPopulationControls() {
            setupCheckbox('enableCreatureLimit', v => {
                enableCreatureLimit = v;
                updateAddButtonState();
                init();
            }, false, [document.getElementById('creatureLimitContainer')]);
            setupCheckbox('enablePointLimit', v => {
                enablePointLimit = v;
                updateAddButtonState();
                init();
            }, false, [document.getElementById('pointLimitContainer')]);
            document.getElementById('autoMode').addEventListener('change', e => {
                autoMode = e.target.value;
                init();
            });
        }

        function setupGravityControls() {
            const sourceSelector = document.getElementById('gravitySource');
            const gravityLabel = document.getElementById('gravityLabel');
            if (!sourceSelector || !gravityLabel) return;

            sourceSelector.addEventListener('change', (e) => {
                window.removeEventListener('deviceorientation', handleOrientationEvent);

                const source = e.target.value;
                if (source === 'fixed') {
                    gravityLabel.childNodes[0].nodeValue = "Gravity Magnitude ";
                    gravityX = 0;
                    gravityY = gravity;
                    debugStatus.textContent = "Fixed (Slider)";
                    debugGravityX.textContent = gravityX.toFixed(3);
                    debugGravityY.textContent = gravityY.toFixed(3);
                } else if (source === 'orientation') {
                    gravityLabel.childNodes[0].nodeValue = "Gravity Sensitivity ";
                    requestOrientationPermissions(sourceSelector);
                }
            });
        }

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            backgroundCanvas.width = window.innerWidth;
            backgroundCanvas.height = window.innerHeight;
            init();
        }

        // --- Setup All Controls ---

        setupSlider('stiffness', 'stiffnessValue', (val) => {
            springStiffness = val;
        });
        setupSlider('damping', 'dampingValue', (val) => {
            damping = val;
        }, true);
        setupSlider('restLength', 'restLengthValue', (val) => {
            restLengthFactor = val;
        });
        setupSlider('gravity', 'gravityValue', (val) => {
            gravity = val;
            if (document.getElementById('gravitySource').value === 'fixed') {
                gravityY = val;
                gravityX = 0;
                debugGravityY.textContent = gravityY.toFixed(3);
                debugGravityX.textContent = '0.000';
            }
        }, true);
        setupSlider('shiverIntensity', 'shiverIntensityValue', (val) => {
            shiverIntensityFactor = val;
        });
        setupSlider('shiverEffect', 'shiverEffectValue', (val) => {
            shiverEffectMultiplier = val;
        }, true);
        setupSlider('shiverPropagation', 'shiverPropagationValue', (val) => {
            shiverPropagationFactor = val;
        }, true);

        setupPropagationSpeedControl(); // Use custom handler for this slider

        setupSlider('shiverDuration', 'shiverDurationValue', (val) => {
            shiverDurationFactor = val;
        }, true);
        setupSlider('footCoordination', 'footCoordinationValue', (val) => {
            footCoordinationFactor = val;
        });
        setupSlider('targetAttraction', 'targetAttractionValue', (val) => {
            targetAttraction = val;
        });
        setupSlider('stepCooldown', 'stepCooldownValue', (val) => {
            stepCooldown = val;
        }, false);
        setupSlider('stepDuration', 'stepDurationValue', (val) => {
            stepDuration = val;
        }, false);
        setupSlider('stepHeight', 'stepHeightValue', (val) => {
            stepHeight = val;
        }, false);
        setupSlider('wobbleStrength', 'wobbleStrengthValue', (val) => {
            wobbleStrength = val;
        }, false);
        setupSlider('pointDensity', 'pointDensityValue', (val) => {
            pointDensity = val;
        }, false, true);
        setupSlider('numFeet', 'numFeetValue', (val) => {
            numFeet = val;
        }, false, true);
        setupSlider('numSeekingFeet', 'numSeekingFeetValue', (val) => {
            numSeekingFeet = val;
        }, false, false);
        setupSlider('waveDelay', 'waveDelayValue', (val) => {
            waveDelay = val;
        }, false);
        setupSlider('lifespan', 'lifespanValue', (val) => {
            lifespanSeconds = val;
        }, false, false);
        setupSlider('maxSteps', 'maxStepsValue', (val) => {
            maxFootsteps = val;
        }, false, false);
        setupSlider('maxCreatures', 'maxCreaturesValue', (val) => {
            maxCreatures = val;
            updateAddButtonState();
        }, false);
        setupSlider('maxPoints', 'maxPointsValue', (val) => {
            maxPoints = val;
            updateAddButtonState();
        }, false);
        setupSlider('maxLineThickness', 'maxLineThicknessValue', (val) => {
            maxLineThickness = val;
        }, true);
        setupSlider('autoAddDelay', 'autoAddDelayValue', (val) => {
            autoAddDelaySeconds = val;
        }, true);
        setupSlider('minShade', 'minShadeValue', (val) => {
            minShade = val;
        }, true);
        setupSlider('imprintShade', 'imprintShadeValue', (val) => {
            imprintShade = val;
        }, true);
        setupSlider('minPointsPerFoot', 'minPointsPerFootValue', (val) => {
            minPointsPerFoot = val;
        }, false, true);
        setupSlider('printInterval', 'printIntervalValue', (val) => {
            printIntervalMs = val;
        }, false);
        setupSlider('growthSpeed', 'growthSpeedValue', val => {
            growthSpeed = val;
        }, false, false);

        setupCheckbox('enableTendrils', (val) => {
            enableTendrils = val;
        }, true, [document.getElementById('tendrilControlsContainer')]);
        setupCheckbox('randomPlacement', (val) => {
            useRandomPlacement = val;
        }, true);
        setupCheckbox('pruneUnfooted', (val) => {
            pruneUnfootedPoints = val;
            document.getElementById('pruneThresholdContainer').style.display = val ? 'block' : 'none';
        }, true, [document.getElementById('pruneThresholdContainer')]);

        setupShapeSelector();
        setupGaitSelector();
        setupTendrilControls();
        setupAppearanceControls();
        setupPointSizeVariationControl();
        setupToggleControlsButton();
        setupInteractionHandlers();
        setupEraseButton();
        setupRandomizeButtons();
        setupBreathingControls();
        setupBirthControls();
        setupAgingControls();
        setupPopulationControls();
        setupCopyButton();
        setupGravityControls();

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', updateOrientationDebug);

        handleResize();
        updateOrientationDebug();
        setDefaultGravitySource();

        animate();
    </script>
</body>

</html>
