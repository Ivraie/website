<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ivraie - Procedural Motion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1c1c2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -2;
            background: #ffffff;
        }
        #title-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }
        #title-container h1 {
            font-size: 10vw;
            color: rgba(0, 0, 0, 1);
            font-weight: lighter;
            letter-spacing: 0.05em;
        }

        #toggleControlsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: transparent;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            /* border: none; */
        }

        .main-content {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            width: 100%;
        }
        .controls {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 20px 25px;
            width: 700px; 
            max-width: 95%;
            -webkit-column-count: 2;
            -moz-column-count: 2;
            column-count: 2;
            -webkit-column-gap: 25px;
            -moz-column-gap: 25px;
            column-gap: 25px;
            transition: opacity 0.3s, transform 0.3s;
        }
        .controls.hidden { display: none; }
        .control-group {
             margin-bottom: 20px;
             -webkit-column-break-inside: avoid;
             page-break-inside: avoid;
             break-inside: avoid;
        }
        .control-group h3 {
            font-weight: normal;
             margin-bottom: 15px;
             border-bottom: 1px solid rgba(0,0,0,0.1);
             padding-bottom: 5px;
        }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; }
        .checkbox-label { display: inline-block; margin-left: 8px; vertical-align: middle; }
        input[type="checkbox"], select { vertical-align: middle; }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none; appearance: none;
            height: 5px; background: rgba(0,0,0,0.1);
            border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px;
            background: #000; border-radius: 50%;
            cursor: pointer; border: 2px solid #f4f4f9;
        }
        input[type="range"]::-moz-range-thumb {
            width: 15px; height: 15px;
            background: #000; border-radius: 50%;
            cursor: pointer; border: 2px solid #f4f4f9;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            background: rgba(0,0,0,0.02);
            color: #1c1c2e;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 4px;
            font-family: inherit;
        }
        input[type="text"] { font-size: 1.2rem; text-align: center; font-weight: bold; text-transform: uppercase; }
        .value-display { float: right; font-weight: bold; color: #4a47a3; }
        
        /* --- ADDED STYLES FOR FOOTER --- */
        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through the container */
        }
        footer a {
            pointer-events: auto; /* Make the links themselves clickable */
            color: #1c1c2e;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s ease-in-out;
        }
        footer a:hover {
            background: rgba(255, 255, 255, 1);
            color: #000;
            border-color: rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <button id="toggleControlsBtn" title="Toggle Controls">
    </button>
    <canvas id="canvas"></canvas>
    <div id="title-container"><h1>Ivraie</h1></div>

    <main class="main-content">
        <div class="controls hidden">
            <div class="control-group">
                <h3>Structure</h3>
                <div>
                    <label for="creatureShape">Creature Shape</label>
                    <select id="creatureShape">
                        <option value="grid" selected>Grid</option>
                        <option value="ring">Ring</option>
                        <option value="star">Star</option>
                        <option value="letter">Letter</option>
                        <option value="bug">Bug</option>
                    </select>
                </div>
                <div id="letterInputContainer" style="display: none;">
                    <label for="letterInput">Enter a Character</label>
                    <input type="text" id="letterInput" value="A" maxlength="1" />
                </div>
                <div>
                    <label for="pointDensity" id="pointDensityLabel">Points / Side <span id="pointDensityValue" class="value-display">13</span></label>
                    <input type="range" id="pointDensity" min="3" max="20" step="1" value="13" />
                </div>
                <div>
                    <label for="numFeet">Number of Feet <span id="numFeetValue" class="value-display">2</span></label>
                    <input type="range" id="numFeet" min="2" max="16" step="1" value="2" />
                </div>
                <div>
                    <label for="restLength">Rest Length <span id="restLengthValue" class="value-display">1.00</span></label>
                    <input type="range" id="restLength" min="0.0" max="1.5" step="0.01" value="1.0" />
                </div>
                <div>
                    <input type="checkbox" id="randomPlacement" />
                    <label for="randomPlacement" class="checkbox-label">Random Foot Placement</label>
                </div>
            </div>
            <div class="control-group">
                <h3>Appearance</h3>
                <div>
                    <label for="drawMode">Draw Mode</label>
                    <select id="drawMode">
                        <option value="point" selected>Point</option>
                        <option value="letter">Letter</option>
                    </select>
                </div>
                <div id="pointSizeContainer">
                    <label for="pointSize">Point Size <span id="pointSizeValue" class="value-display">1.3</span></label>
                    <input type="range" id="pointSize" min="1" max="15" step="0.1" value="1.3" />
                </div>
                <div id="letterChoiceContainer" style="display: none;">
                    <label for="letterChoice">Choose Letter</label>
                    <select id="letterChoice">
                        <option value="i" selected>i</option>
                        <option value="v">v</option>
                        <option value="r">r</option>
                        <option value="a">a</option>
                        <option value="e">e</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <h3>Rigidity</h3>
                 <div>
                    <input type="checkbox" id="enableRigidCore" />
                    <label for="enableRigidCore" class="checkbox-label">Enable Rigid Core</label>
                </div>
                <div id="rigidityControlsContainer">
                    <div>
                        <label for="rigidCoreRadius">Rigid Core Radius <span id="rigidCoreRadiusValue" class="value-display">50</span></label>
                        <input type="range" id="rigidCoreRadius" min="10" max="200" step="1" value="50" />
                    </div>
                     <div>
                        <label for="rigidSectionStiffness">Rigid Stiffness <span id="rigidSectionStiffnessValue" class="value-display">0.80</span></label>
                        <input type="range" id="rigidSectionStiffness" min="0.1" max="1.0" step="0.01" value="0.8" />
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Tendrils</h3>
                <div>
                    <input type="checkbox" id="enableTendrils" checked/>
                    <label for="enableTendrils" class="checkbox-label">Enable Tendrils</label>
                </div>
                <div id="tendrilControlsContainer">
                    <div>
                        <label for="tendrilPlacementMode">Placement Mode</label>
                        <select id="tendrilPlacementMode">
                            <option value="count" selected>Count</option>
                            <option value="density">Density</option>
                        </select>
                    </div>
                    <div id="tendrilCountContainer">
                        <label for="numTendrils">Number of Tendrils <span id="numTendrilsValue" class="value-display">10</span></label>
                        <input type="range" id="numTendrils" min="1" max="200" step="1" value="10" />
                    </div>
                     <div id="tendrilDensityContainer">
                        <label for="tendrilDensity">Tendril Density <span id="tendrilDensityValue" class="value-display">0.10</span></label>
                        <input type="range" id="tendrilDensity" min="0" max="1.0" step="0.01" value="0.1" />
                    </div>
                    <div>
                        <label for="tendrilLength">Tendril Length <span id="tendrilLengthValue" class="value-display">5</span></label>
                        <input type="range" id="tendrilLength" min="2" max="30" step="1" value="5" />
                    </div>
                    <div>
                        <label for="tendrilQuality">Tendril Quality <span id="tendrilQualityValue" class="value-display">1.00</span></label>
                        <input type="range" id="tendrilQuality" min="0.1" max="1.0" step="0.01" value="1.0" />
                    </div>
                     <div>
                        <label for="tendrilLengthVariation">Length Variation <span id="tendrilLengthVariationValue" class="value-display">0%</span></label>
                        <input type="range" id="tendrilLengthVariation" min="0" max="1.0" step="0.01" value="0" />
                    </div>
                    <div>
                        <label for="tendrilStiffness">Tendril Stiffness <span id="tendrilStiffnessValue" class="value-display">0.10</span></label>
                        <input type="range" id="tendrilStiffness" min="0.01" max="0.5" step="0.01" value="0.1" />
                    </div>
                    <div>
                        <input type="checkbox" id="feetOnTendrils" checked />
                        <label for="feetOnTendrils" class="checkbox-label">Place Feet on Tendrils</label>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Motion Physics</h3>
                <div>
                    <label for="stiffness">Body Stiffness <span id="stiffnessValue" class="value-display">0.21</span></label>
                    <input type="range" id="stiffness" min="0.01" max="0.3" step="0.01" value="0.21" />
                </div>
                <div>
                    <label for="damping">Damping <span id="dampingValue" class="value-display">0.918</span></label>
                    <input type="range" id="damping" min="0.9" max="0.999" step="0.001" value="0.918" />
                </div>
                <div>
                    <label for="gravity">Gravity <span id="gravityValue" class="value-display">0.03</span></label>
                    <input type="range" id="gravity" min="0" max="0.5" step="0.01" value="0.03" />
                </div>
                 <div>
                    <label for="shiverIntensity">Shiver Intensity <span id="shiverIntensityValue" class="value-display">0.50</span></label>
                    <input type="range" id="shiverIntensity" min="-3.0" max="3.0" step="0.01" value="0.5" />
                </div>
                 <div>
                    <label for="shiverPropagation">Shiver Propagation <span id="shiverPropagationValue" class="value-display">0.95</span></label>
                    <input type="range" id="shiverPropagation" min="0" max="2" step="0.01" value="0.95" />
                </div>
            </div>
            <div class="control-group">
                <h3>Foot Behavior</h3>
                <div>
                    <label for="gaitPattern">Gait Pattern</label>
                    <select id="gaitPattern">
                        <option value="sequential" selected>Sequential</option>
                        <option value="paired">Paired</option>
                        <option value="sidewinder">Sidewinder</option>
                    </select>
                </div>
                <div id="seekingFeetControl">
                    <label for="numSeekingFeet">Seeking Feet (Sequential) <span id="numSeekingFeetValue" class="value-display">1</span></label>
                    <input type="range" id="numSeekingFeet" min="1" max="6" step="1" value="1" />
                </div>
                <div id="waveDelayControl" style="display: none;">
                    <label for="waveDelay">Wave Delay (frames) <span id="waveDelayValue" class="value-display">5</span></label>
                    <input type="range" id="waveDelay" min="0" max="20" step="1" value="5" />
                </div>
                <div>
                    <label for="footCoordination">Foot Coordination <span id="footCoordinationValue" class="value-display">0.00</span></label>
                    <input type="range" id="footCoordination" min="0.0" max="1.0" step="0.01" value="0.0" />
                </div>
                <div>
                    <label for="stepCooldown">Step Cooldown (frames) <span id="stepCooldownValue" class="value-display">10</span></label>
                    <input type="range" id="stepCooldown" min="0" max="120" step="1" value="10" />
                </div>
                <div>
                    <label for="targetAttraction">Target Attraction <span id="targetAttractionValue" class="value-display">0.05</span></label>
                    <input type="range" id="targetAttraction" min="0.01" max="0.2" step="0.01" value="0.05" />
                </div>
                <div>
                    <label for="stepDuration">Step Duration <span id="stepDurationValue" class="value-display">120</span></label>
                    <input type="range" id="stepDuration" min="50" max="300" step="10" value="120" />
                </div>
                <div>
                    <label for="stepHeight">Step Height <span id="stepHeightValue" class="value-display">30</span></label>
                    <input type="range" id="stepHeight" min="10" max="80" step="1" value="30" />
                </div>
                <div>
                    <label for="wobbleStrength">Seek Wobble <span id="wobbleStrengthValue" class="value-display">10</span></label>
                    <input type="range" id="wobbleStrength" min="0" max="50" step="1" value="10" />
                </div>
            </div>
            <div class="control-group">
                <h3>Performance</h3>
                <div>
                    <label>Frame Rate
                        <span id="fpsCounter" class="value-display">--</span>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <!-- --- ADDED FOOTER ELEMENT --- -->
    <footer>
        <a href="https://linktr.ee/ivraie" target="_blank" rel="noopener noreferrer">linktr.ee/ivraie</a>
        <a href="https://www.instagram.com/ant_______1/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsCounterElement = document.getElementById('fpsCounter');
        
        let points = [], springs = [], feet = [];
        let time = 0, nextFootToWake = 0;

        let frameCount = 0, lastFpsUpdateTime = 0, fps = 0;

        // --- Default values from image ---
        let creatureShape = 'grid', pointDensity = 13, numFeet = 2, restLengthFactor = 1.0, useRandomPlacement = false;
        let damping = 0.918, springStiffness = 0.21, gravity = 0.03, shiverIntensityFactor = 0.5, shiverPropagationFactor = 0.95;
        let numSeekingFeet = 1, footCoordinationFactor = 0.0, stepCooldown = 10, stepDuration = 120, stepHeight = 30, wobbleStrength = 10, targetAttraction = 0.05;
        let gaitPattern = 'sequential', footPairs = [], nextPairToWake = 0, gaitActivationQueue = [], waveDelay = 5;
        
        let enableTendrils = true, numTendrils = 10, tendrilLength = 5, tendrilStiffness = 0.1, placeFeetOnTendrils = true;
        let tendrilPlacementMode = 'count', tendrilDensity = 0.1, tendrilQuality = 1.0, tendrilLengthVariation = 0;
        
        let enableRigidCore = false, rigidCoreRadius = 50, rigidSectionStiffness = 0.8;
        
        let drawMode = 'point';
        let pointBaseSize = 1.3;
        let letterToDraw = 'i';

        const FOOT_STATES = { FIXED: 0, SEEKING: 1, SETTLING: 2 };
        const HIGH_DENSITY_THRESHOLD = 200;

        function activateFoot(foot) { if (foot && foot.footState === FOOT_STATES.FIXED) { const randomTarget = foot.getRandomEdgeTarget(); const coordinatedTarget = foot.getCoordinatedTarget(); const finalX = randomTarget.x * (1 - footCoordinationFactor) + coordinatedTarget.x * footCoordinationFactor; const finalY = randomTarget.y * (1 - footCoordinationFactor) + coordinatedTarget.y * footCoordinationFactor; foot.targetPos = { x: finalX, y: finalY }; foot.footState = FOOT_STATES.SEEKING; foot.stepStartTime = time; return true; } return false; }
        function processGaitQueue() { if (gaitActivationQueue.length === 0) return; for (let i = gaitActivationQueue.length - 1; i >= 0; i--) { const item = gaitActivationQueue[i]; item.delay--; if (item.delay <= 0) { activateFoot(item.foot); gaitActivationQueue.splice(i, 1); } } }
        function wakeNextMovers(triggeringFoot = null) { switch (gaitPattern) { case 'paired': if (footPairs.length === 0) return; for (let i = 0; i < footPairs.length; i++) { const pairIndex = (nextPairToWake + i) % footPairs.length; const pair = footPairs[pairIndex]; if (pair.every(foot => foot.footState === FOOT_STATES.FIXED)) { for (const foot of pair) activateFoot(foot); nextPairToWake = (pairIndex + 1) % footPairs.length; return; } } break; case 'sidewinder': if (feet.length === 0 || gaitActivationQueue.length > 0) return; let centerX = 0; for (const p of points) centerX += p.x; centerX /= points.length; const triggerSide = triggeringFoot ? (triggeringFoot.x < centerX ? 'left' : 'right') : 'right'; const sideToWake = triggerSide === 'left' ? 'right' : 'left'; let feetToWake = feet.filter(foot => { const footSide = foot.x < centerX ? 'left' : 'right'; return footSide === sideToWake && foot.footState === FOOT_STATES.FIXED; }); if (feetToWake.length === 0) { feetToWake = feet.filter(foot => foot.footState === FOOT_STATES.FIXED); } feetToWake.sort((a, b) => a.y - b.y); for (let i = 0; i < feetToWake.length; i++) { gaitActivationQueue.push({ foot: feetToWake[i], delay: i * waveDelay }); } break; case 'sequential': default: if (feet.length === 0) return; for (let i = 0; i < feet.length; i++) { nextFootToWake = (nextFootToWake + 1) % feet.length; if (activateFoot(feet[nextFootToWake])) break; } break; } }
        class SpatialHashGrid { constructor(bounds, cellSize) { this.bounds = bounds; this.cellSize = cellSize; this.cols = Math.ceil(bounds.width / cellSize); this.rows = Math.ceil(bounds.height / cellSize); this.grid = new Map(); } _getKey(x, y) { return `${x}|${y}`; } insert(point, index) { const cx = Math.floor(point.x / this.cellSize); const cy = Math.floor(point.y / this.cellSize); const key = this._getKey(cx, cy); if (!this.grid.has(key)) { this.grid.set(key, []); } this.grid.get(key).push({ point, index }); } query(point, radius) { const nearby = []; const r = radius / this.cellSize; const cx = Math.floor(point.x / this.cellSize); const cy = Math.floor(point.y / this.cellSize); for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) { const key = this._getKey(x, y); if (this.grid.has(key)) { nearby.push(...this.grid.get(key)); } } } return nearby; } }
        class Point { constructor(x, y, isFoot = false) { this.x = this.oldX = x; this.y = this.oldY = y; this.isFoot = isFoot; this.isHair = false; this.footState = isFoot ? FOOT_STATES.FIXED : null; this.targetPos = { x, y }; this.searchPhase = Math.random() * Math.PI * 2; this.mass = 1; this.stepStartTime = 0; this.settleStartTime = 0; this.pulseMagnitude = 0; } update() { if (this.isFoot) this.updateFoot(); else this.updateBody(); } updateBody() { const vX = (this.x - this.oldX) * damping; const vY = (this.y - this.oldY) * damping; this.oldX = this.x; this.oldY = this.y; this.x += vX; this.y += vY + gravity; } updateFoot() { switch (this.footState) { case FOOT_STATES.FIXED: this.x = this.targetPos.x; this.y = this.targetPos.y; break; case FOOT_STATES.SEEKING: let progress = (time - this.stepStartTime) / stepDuration; if (progress > 1) { this.setEdgeTarget(); this.stepStartTime = time; progress = 0; } const wobbleX = Math.sin(time * 0.02 + this.searchPhase) * wobbleStrength; const wobbleY = Math.cos(time * 0.015 + this.searchPhase) * wobbleStrength; const lift = Math.sin(progress * Math.PI) * stepHeight; this.x += (this.targetPos.x - this.x) * targetAttraction + wobbleX; this.y += (this.targetPos.y - this.y) * targetAttraction - lift + wobbleY; if (this.x <= 1 || this.x >= canvas.width - 1 || this.y <= 1 || this.y >= canvas.height - 1) { this.footState = FOOT_STATES.SETTLING; this.settleStartTime = time; this.targetPos.x = Math.max(0, Math.min(canvas.width, this.x)); this.targetPos.y = Math.max(0, Math.min(canvas.height, this.y)); this.pulseMagnitude = 1.0; } break; case FOOT_STATES.SETTLING: this.x = this.targetPos.x; this.y = this.targetPos.y; if (time > this.settleStartTime + stepCooldown) { this.footState = FOOT_STATES.FIXED; wakeNextMovers(this); } break; } } applyForce(fx, fy) { if (this.footState === FOOT_STATES.FIXED || this.footState === FOOT_STATES.SETTLING) return; this.x += fx / this.mass; this.y += fy / this.mass; } getRandomEdgeTarget() { const edge         class Spring { constructor(p1, p2, baseLength) { this.p1 = p1; this.p2 = p2; this.baseRestLength = baseLength; this.isHair = false; this.isRigid = false; } update() { const averagePulse = (this.p1.pulseMagnitude + this.p2.pulseMagnitude) / 2; const contraction = 1.0 - (averagePulse * shiverIntensityFactor); const currentRestLength = this.baseRestLength * restLengthFactor * contraction; const dx = this.p2.x - this.p1.x; const dy = this.p2.y - this.p1.y; const dist = Math.hypot(dx, dy); if (dist < 0.01) return; let stiffness = springStiffness; if (this.isHair) { stiffness = tendrilStiffness; } else if (this.isRigid) { stiffness = rigidSectionStiffness; } const forceScalar = (dist - currentRestLength) * stiffness; const fx = (dx / dist) * forceScalar; const fy = (dy / dist) * forceScalar; this.p1.applyForce(fx, fy); this.p2.applyForce(-fx, -fy); } }

        setupSlider('footCoordination', 'footCoordinationValue', (val) => { footCoordinationFactor = val; });
        setupSlider('targetAttraction', 'targetAttractionValue', (val) => { targetAttraction = val; });
        setupSlider('stepCooldown', 'stepCooldownValue', (val) => { stepCooldown = val; }, false);
        setupSlider('stepDuration', 'stepDurationValue', (val) => { stepDuration = val; }, false);
        setupSlider('stepHeight', 'stepHeightValue', (val) => { stepHeight = val; }, false);
        setupSlider('wobbleStrength', 'wobbleStrengthValue', (val) => { wobbleStrength = val; }, false);
        setupSlider('pointDensity', 'pointDensityValue', (val) => { pointDensity = val; }, false, true);
        setupSlider('numFeet', 'numFeetValue', (val) => { numFeet = val; }, false, true);
        setupSlider('numSeekingFeet', 'numSeekingFeetValue', (val) => { numSeekingFeet = val; }, false, true);
        setupSlider('waveDelay', 'waveDelayValue', (val) => { waveDelay = val; }, false);
        setupSlider('rigidCoreRadius', 'rigidCoreRadiusValue', (val) => { rigidCoreRadius = val; }, false, true);
        setupSlider('rigidSectionStiffness', 'rigidSectionStiffnessValue', (val) => { rigidSectionStiffness = val; }, true, true);
        
        setupCheckbox('enableRigidCore', (val) => { enableRigidCore = val; }, true, [document.getElementById('rigidityControlsContainer')]);
        setupCheckbox('enableTendrils', (val) => { enableTendrils = val; }, true, [document.getElementById('tendrilControlsContainer')]);
        setupCheckbox('randomPlacement', (val) => { useRandomPlacement = val; }, true);
        
        setupShapeSelector();
        setupGaitSelector();
        setupTendrilControls();
        setupAppearanceControls();
        setupToggleControlsButton();

        window.addEventListener('resize', handleResize);
        handleResize();
        
        animate();
    </script>
</body>
</html>
