<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ivraie - Ink on canvas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1c1c2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -2;
            background: #ffffff;
        }
        #title-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }
        #title-container h1 {
            font-size: 10vw;
            color: rgba(0, 0, 0, 1);
            font-weight: lighter;
            letter-spacing: 0.05em;
            pointer-events: auto; /* Make the title clickable */
            cursor: pointer;
            transition: color 0.2s ease-in-out;
        }
        #title-container h1:hover {
            color: rgba(0, 0, 0, 0.7);
        }

        #toggleControlsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: transparent;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            position: relative; /* Establishes a stacking context */
            z-index: 8;      /* Higher than the footer's z-index */
        }
        .controls {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 20px 25px;
            width: 700px;
            max-width: 95%;
            -webkit-column-count: 2;
            -moz-column-count: 2;
            column-count: 2;
            -webkit-column-gap: 25px;
            -moz-column-gap: 25px;
            column-gap: 25px;
            transition: opacity 0.3s, transform 0.3s;
        }
        .controls.hidden { display: none; }
        .control-group {
             margin-bottom: 20px;
             -webkit-column-break-inside: avoid;
             page-break-inside: avoid;
             break-inside: avoid;
        }
        .control-group h3 {
            font-weight: normal;
             margin-bottom: 15px;
             border-bottom: 1px solid rgba(0,0,0,0.1);
             padding-bottom: 5px;
        }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; }
        .checkbox-label { display: inline-block; margin-left: 8px; vertical-align: middle; }
        input[type="checkbox"], select { vertical-align: middle; }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none; appearance: none;
            height: 5px; background: rgba(0,0,0,0.1);
            border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px;
            background: #000; border-radius: 50%;
            cursor: pointer; border: 2px solid #f4f4f9;
        }
        input[type="range"]::-moz-range-thumb {
            width: 15px; height: 15px;
            background: #000; border-radius: 50%;
            cursor: pointer; border: 2px solid #f4f4f9;
        }
        select, input[type="text"], button.control-button {
            width: 100%;
            padding: 8px;
            background: rgba(0,0,0,0.02);
            color: #1c1c2e;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 4px;
            font-family: inherit;
        }
        input[type="text"] { font-size: 1.2rem; text-align: center; font-weight: bold; text-transform: uppercase; }
        .value-display { float: right; font-weight: bold; color: #4a47a3; }
        button.control-button {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.control-button:hover {
            background-color: rgba(0,0,0,0.08);
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        footer a {
            pointer-events: auto;
            color: #1c1c2e;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s ease-in-out;
        }
        footer a:hover {
            background: rgba(255, 255, 255, 1);
            color: #000;
            border-color: rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
        
        #debug-info {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        #debug-info p {
            margin: 0;
            padding: 0;
        }
        #debug-info span {
            font-weight: bold;
            color: #d62828;
        }
    </style>
</head>
<body>
    
    <button id="toggleControlsBtn" title="Toggle Controls"></button>
    <canvas id="canvas"></canvas>
    <div id="title-container"><h1>Ivraie</h1></div>

    <main class="main-content">
        <div class="controls hidden">
            <div class="control-group">
                <h3>Structure</h3>
                <div>
                    <label for="creatureShape">Creature Shape</label>
                    <select id="creatureShape">
                        <option value="grid" selected>Grid</option>
                        <option value="cross">Cross</option>
                        <option value="letter">Letter</option>
                        <option value="bug">Bug</option>
                    </select>
                </div>
                <div id="letterInputContainer" style="display: none;">
                    <label for="letterInput">Enter a Character</label>
                    <input type="text" id="letterInput" value="A" maxlength="1" />
                </div>
                <div>
                    <label for="pointDensity" id="pointDensityLabel">Points / Side <span id="pointDensityValue" class="value-display">13</span></label>
                    <input type="range" id="pointDensity" min="3" max="20" step="1" value="13" />
                </div>
                <div>
                    <label for="numFeet">Number of Feet <span id="numFeetValue" class="value-display">2</span></label>
                    <input type="range" id="numFeet" min="2" max="16" step="1" value="2" />
                </div>
                <div>
                    <label for="restLength">Rest Length <span id="restLengthValue" class="value-display">1.00</span></label>
                    <input type="range" id="restLength" min="0.0" max="1.5" step="0.01" value="1.0" />
                </div>
                <div>
                    <input type="checkbox" id="randomPlacement" />
                    <label for="randomPlacement" class="checkbox-label">Random Foot Placement</label>
                </div>
            </div>
            <div class="control-group">
                <h3>Appearance</h3>
                <div>
                    <label for="drawMode">Draw Mode</label>
                    <select id="drawMode">
                        <option value="point" selected>Point</option>
                        <option value="letter">Letter</option>
                    </select>
                </div>
                <div id="pointSizeContainer">
                    <label for="pointSize">Point Size <span id="pointSizeValue" class="value-display">1.3</span></label>
                    <input type="range" id="pointSize" min="1" max="15" step="0.1" value="1.3" />
                </div>
                <div id="letterSizeContainer" style="display: none;">
                    <label for="letterSize">Letter Size <span id="letterSizeValue" class="value-display">10</span></label>
                    <input type="range" id="letterSize" min="5" max="50" step="1" value="10" />
                </div>
            </div>
            <div class="control-group">
                <h3>Tendrils</h3>
                <div>
                    <input type="checkbox" id="enableTendrils" checked/>
                    <label for="enableTendrils" class="checkbox-label">Enable Tendrils</label>
                </div>
                <div id="tendrilControlsContainer">
                    <div>
                        <label for="tendrilPlacementMode">Placement Mode</label>
                        <select id="tendrilPlacementMode">
                            <option value="count" selected>Count</option>
                            <option value="density">Density</option>
                        </select>
                    </div>
                    <div id="tendrilCountContainer">
                        <label for="numTendrils">Number of Tendrils <span id="numTendrilsValue" class="value-display">10</span></label>
                        <input type="range" id="numTendrils" min="1" max="200" step="1" value="10" />
                    </div>
                     <div id="tendrilDensityContainer">
                        <label for="tendrilDensity">Tendril Density <span id="tendrilDensityValue" class="value-display">0.10</span></label>
                        <input type="range" id="tendrilDensity" min="0" max="1.0" step="0.01" value="0.1" />
                    </div>
                    <div>
                        <label for="tendrilLength">Tendril Length <span id="tendrilLengthValue" class="value-display">5</span></label>
                        <input type="range" id="tendrilLength" min="2" max="30" step="1" value="5" />
                    </div>
                    <div>
                        <label for="tendrilQuality">Tendril Quality <span id="tendrilQualityValue" class="value-display">1.00</span></label>
                        <input type="range" id="tendrilQuality" min="0.1" max="1.0" step="0.01" value="1.0" />
                    </div>
                     <div>
                        <label for="tendrilLengthVariation">Length Variation <span id="tendrilLengthVariationValue" class="value-display">0%</span></label>
                        <input type="range" id="tendrilLengthVariation" min="0" max="1.0" step="0.01" value="0" />
                    </div>
                    <div>
                        <label for="tendrilStiffness">Tendril Stiffness <span id="tendrilStiffnessValue" class="value-display">0.10</span></label>
                        <input type="range" id="tendrilStiffness" min="0.01" max="0.5" step="0.01" value="0.1" />
                    </div>
                    <div>
                        <input type="checkbox" id="feetOnTendrils" checked />
                        <label for="feetOnTendrils" class="checkbox-label">Place Feet on Tendrils</label>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Motion Physics</h3>
                <div>
                    <label for="stiffness">Body Stiffness <span id="stiffnessValue" class="value-display">0.21</span></label>
                    <input type="range" id="stiffness" min="0.01" max="0.3" step="0.01" value="0.21" />
                </div>
                <div>
                    <label for="dampingFactor">Damping <span id="dampingFactorValue" class="value-display">0.082</span></label>
                    <input type="range" id="dampingFactor" min="0.001" max="0.1" step="0.001" value="0.082" />
                </div>
                 <div>
                    <label for="shiverIntensity">Shiver Intensity <span id="shiverIntensityValue" class="value-display">0.50</span></label>
                    <input type="range" id="shiverIntensity" min="-3.0" max="3.0" step="0.01" value="0.5" />
                </div>
                 <div>
                    <label for="shiverPropagation">Shiver Propagation <span id="shiverPropagationValue" class="value-display">0.85</span></label>
                    <input type="range" id="shiverPropagation" min="0" max="0.9" step="0.01" value="0.85" />
                </div>
            </div>
            <div class="control-group">
                <h3>Gravity & Sensors</h3>
                <div>
                    <label for="gravitySource">Gravity Source</label>
                    <select id="gravitySource">
                        <option value="fixed" selected>Slider (Fixed)</option>
                        <option value="motion">Device Motion</option>
                        <option value="orientation">Device Orientation</option>
                    </select>
                </div>
                <div>
                    <label for="gravity" id="gravityLabel">Gravity <span id="gravityValue" class="value-display">0.03</span></label>
                    <input type="range" id="gravity" min="-0.5" max="0.5" step="0.01" value="0.03" />
                </div>
                <div>
                    <label>Gravity Direction</label>
                    <div style="text-align: center; margin-top: 10px;">
                        <canvas id="gravity-indicator-canvas" width="80" height="80" style="border: 1px solid rgba(0,0,0,0.1); border-radius: 50%; background: #fdfdfd;"></canvas>
                    </div>
                </div>
                <div id="debug-info-container" style="margin-top: 15px;">
                    <label>Debug Info</label>
                    <div id="debug-info">
                        <p>Status: <span id="debug-status">--</span></p>
                        <p>Orientation: <span id="debug-orientation">--</span></p>
                        <p>Raw Accel X|Y|Z: <span id="debug-accel-x">--</span> | <span id="debug-accel-y">--</span> | <span id="debug-accel-z">--</span></p>
                        <p>Raw Orient B|G: <span id="debug-orient-beta">--</span> | <span id="debug-orient-gamma">--</span></p>
                        <p>Gravity X|Y: <span id="debug-gravity-x">--</span> | <span id="debug-gravity-y">--</span></p>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Foot Behavior</h3>
                <div>
                    <label for="gaitPattern">Gait Pattern</label>
                    <select id="gaitPattern">
                        <option value="sequential" selected>Sequential</option>
                        <option value="paired">Paired</option>
                        <option value="sidewinder">Sidewinder</option>
                    </select>
                </div>
                <div id="seekingFeetControl">
                    <label for="numSeekingFeet">Seeking Feet (Sequential) <span id="numSeekingFeetValue" class="value-display">1</span></label>
                    <input type="range" id="numSeekingFeet" min="1" max="6" step="1" value="1" />
                </div>
                <div id="waveDelayControl" style="display: none;">
                    <label for="waveDelay">Wave Delay (frames) <span id="waveDelayValue" class="value-display">5</span></label>
                    <input type="range" id="waveDelay" min="0" max="20" step="1" value="5" />
                </div>
                <div>
                    <label for="footCoordination">Foot Coordination <span id="footCoordinationValue" class="value-display">0.00</span></label>
                    <input type="range" id="footCoordination" min="0.0" max="1.0" step="0.01" value="0.0" />
                </div>
                <div>
                    <label for="stepCooldown">Step Cooldown (frames) <span id="stepCooldownValue" class="value-display">10</span></label>
                    <input type="range" id="stepCooldown" min="0" max="120" step="1" value="10" />
                </div>
                <div>
                    <label for="targetAttraction">Target Attraction <span id="targetAttractionValue" class="value-display">0.05</span></label>
                    <input type="range" id="targetAttraction" min="0.01" max="0.2" step="0.01" value="0.05" />
                </div>
                <div>
                    <label for="stepDuration">Step Duration <span id="stepDurationValue" class="value-display">120</span></label>
                    <input type="range" id="stepDuration" min="50" max="300" step="10" value="120" />
                </div>
                <div>
                    <label for="stepHeight">Step Height <span id="stepHeightValue" class="value-display">30</span></label>
                    <input type="range" id="stepHeight" min="10" max="80" step="1" value="30" />
                </div>
                <div>
                    <label for="wobbleStrength">Seek Wobble <span id="wobbleStrengthValue" class="value-display">10</span></label>
                    <input type="range" id="wobbleStrength" min="0" max="50" step="1" value="10" />
                </div>
            </div>
            <div class="control-group">
                <h3>Performance</h3>
                <div>
                    <label>Frame Rate
                        <span id="fpsCounter" class="value-display">--</span>
                    </label>
                </div>
                <div style="margin-top: 15px;">
                    <button id="randomize-btn" class="control-button">Randomize</button>
                </div>
                <div style="margin-top: 15px;">
                    <button id="reset-settings-btn" class="control-button">Reset to Defaults</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://linktr.ee/ivraie" target="_blank" rel="noopener noreferrer">linktr.ee/ivraie</a>
        <a href="https://www.instagram.com/ant_______1/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsCounterElement = document.getElementById('fpsCounter');
        const gravityIndicatorCanvas = document.getElementById('gravity-indicator-canvas');
        const gravityIndicatorCtx = gravityIndicatorCanvas.getContext('2d');
        
        const debugStatus = document.getElementById('debug-status');
        const debugOrientation = document.getElementById('debug-orientation');
        const debugAccelX = document.getElementById('debug-accel-x');
        const debugAccelY = document.getElementById('debug-accel-y');
        const debugAccelZ = document.getElementById('debug-accel-z');
        const debugOrientBeta = document.getElementById('debug-orient-beta');
        const debugOrientGamma = document.getElementById('debug-orient-gamma');
        const debugGravityX = document.getElementById('debug-gravity-x');
        const debugGravityY = document.getElementById('debug-gravity-y');

        let points = [], springs = [], feet = [];
        let time = 0, nextFootToWake = 0;
        let frameCount = 0, lastFpsUpdateTime = 0, fps = 0;
        let gravityX = 0, gravityY = 0;

        let config = {
            creatureShape: 'grid',
            letterInput: 'A',
            pointDensity: 13,
            numFeet: 2,
            restLengthFactor: 1.0,
            useRandomPlacement: false,
            drawMode: 'point',
            pointBaseSize: 1.3,
            letterBaseSize: 10,
            enableTendrils: true,
            tendrilPlacementMode: 'count',
            numTendrils: 10,
            tendrilDensity: 0.1,
            tendrilLength: 5,
            tendrilQuality: 1.0,
            tendrilLengthVariation: 0,
            tendrilStiffness: 0.1,
            placeFeetOnTendrils: true,
            springStiffness: 0.21,
            dampingFactor: 0.082,
            gravity: 0.03,
            shiverIntensityFactor: 0.5,
            shiverPropagationFactor: 0.85,
            gaitPattern: 'sequential',
            numSeekingFeet: 1,
            waveDelay: 5,
            footCoordinationFactor: 0.0,
            stepCooldown: 10,
            targetAttraction: 0.05,
            stepDuration: 120,
            stepHeight: 30,
            wobbleStrength: 10,
        };

        const FOOT_STATES = { FIXED: 0, SEEKING: 1, SETTLING: 2 };
        const HIGH_DENSITY_THRESHOLD = 200;
        const DRAW_LETTERS = ['i', 'v', 'r', 'a', 'i', 'e'];

        function saveConfig() {
            try {
                localStorage.setItem('ivraie-config', JSON.stringify(config));
            } catch (e) {
                console.error("Failed to save config to localStorage:", e);
            }
        }

        function loadConfig() {
            try {
                const savedConfig = localStorage.getItem('ivraie-config');
                if (savedConfig) {
                    const parsedConfig = JSON.parse(savedConfig);
                    config = { ...config, ...parsedConfig };
                }
            } catch (e) {
                console.error("Failed to load config from localStorage:", e);
            }
        }

        function applyConfigToUI() {
            for (const key in config) {
                const element = document.getElementById(key);
                if (element) {
                    if (element.type === 'checkbox') {
                        element.checked = config[key];
                    } else {
                        element.value = config[key];
                    }
                    element.dispatchEvent(new Event('input', { bubbles:true }));
                    element.dispatchEvent(new Event('change', { bubbles:true }));
                }
            }
            document.getElementById('letterInput').value = config.letterInput;
        }

        function setupResetButton() {
            const resetButton = document.getElementById('reset-settings-btn');
            resetButton.addEventListener('click', () => {
                localStorage.removeItem('ivraie-config');
                location.reload();
            });
        }
        
        function randomizeConfig() {
            const getRandomFloat = (min, max) => Math.random() * (max - min) + min;
            const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const getRandomBool = () => Math.random() < 0.5;
            const getRandomFromList = (arr) => arr[Math.floor(Math.random() * arr.length)];

            config.creatureShape = getRandomFromList(['grid', 'cross', 'letter', 'bug']);
            config.restLengthFactor = getRandomFloat(0.5, 1.2);
            config.useRandomPlacement = getRandomBool();
            config.drawMode = getRandomFromList(['point', 'letter']);
            config.pointBaseSize = getRandomFloat(1, 5);
            config.letterBaseSize = getRandomInt(8, 30);
            config.enableTendrils = getRandomBool();
            config.tendrilPlacementMode = getRandomFromList(['count', 'density']);
            config.numTendrils = getRandomInt(5, 80);
            config.tendrilDensity = getRandomFloat(0.05, 0.5);
            config.tendrilLength = getRandomInt(3, 20);
            config.tendrilQuality = getRandomFloat(0.2, 1.0);
            config.tendrilLengthVariation = getRandomFloat(0, 1.0);
            config.tendrilStiffness = getRandomFloat(0.01, 0.3);
            config.placeFeetOnTendrils = getRandomBool();
            config.springStiffness = getRandomFloat(0.05, 0.3);
            config.dampingFactor = getRandomFloat(0.01, 0.1);
            config.shiverIntensityFactor = getRandomFloat(-2.0, 2.0);
            config.shiverPropagationFactor = getRandomFloat(0.1, 0.9);
            config.gaitPattern = getRandomFromList(['sequential', 'paired', 'sidewinder']);
            config.numSeekingFeet = getRandomInt(1, 4);
            config.waveDelay = getRandomInt(1, 15);
            config.footCoordinationFactor = getRandomFloat(0, 1.0);
            config.stepCooldown = getRandomInt(5, 60);
            config.targetAttraction = getRandomFloat(0.02, 0.15);
            config.stepDuration = getRandomInt(80, 250);
            config.stepHeight = getRandomInt(15, 70);
            config.wobbleStrength = getRandomInt(0, 40);

            applyConfigToUI();
            saveConfig();
            init();
        }

        function setupRandomizeButton() {
            const randomizeButton = document.getElementById('randomize-btn');
            randomizeButton.addEventListener('click', randomizeConfig);
        }

        function setupTitleClick() {
            const titleElement = document.querySelector('#title-container h1');
            if (titleElement) {
                titleElement.addEventListener('click', randomizeConfig);
            }
        }

                        const fontSize = Math.max(1, config.letterBaseSize * radiusMultiplier);
                        ctx.font = `lighter ${fontSize}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(p.letter, p.x, p.y);
                    }
                }
            }
        }
        function animate() { frameCount++; const currentTime = performance.now(); const deltaTime = currentTime - lastFpsUpdateTime; if (deltaTime > 1000) { fps = Math.round((frameCount * 1000) / deltaTime); if (fpsCounterElement) { fpsCounterElement.textContent = fps; } frameCount = 0; lastFpsUpdateTime = currentTime; } update(); draw(); drawGravityIndicator(); requestAnimationFrame(animate); }
        function setupSlider(id, valueDisplayId, setter, isFloat = true, requiresReset = false) { const slider = document.getElementById(id); if (!slider) return; const display = document.getElementById(valueDisplayId); slider.addEventListener('input', e => { const value = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value, 10); setter(value); if (display) { if (isFloat) { const precision = (id === 'dampingFactor') ? 3 : (id === 'pointSize' ? 1 : 2); display.textContent = value.toFixed(precision); } else { display.textContent = value; } } saveConfig(); if (requiresReset) { init(); } }); }
        function setupCheckbox(id, setter, requiresReset = false, dependentControls = []) { const checkbox = document.getElementById(id); if (!checkbox) return; const updateDependents = (checked) => { for (const control of dependentControls) { if (control) { control.style.display = checked ? 'block' : 'none'; } } }; checkbox.addEventListener('change', e => { const checked = e.target.checked; setter(checked); updateDependents(checked); saveConfig(); if (requiresReset) init(); }); updateDependents(checkbox.checked); }

        function handleMotionEvent(event) {
            if (event.accelerationIncludingGravity.x === null || event.accelerationIncludingGravity.y === null) return;
            const rawX = event.accelerationIncludingGravity.x;
            const rawY = event.accelerationIncludingGravity.y;
            const rawZ = event.accelerationIncludingGravity.z;
            
            debugAccelX.textContent = rawX.toFixed(3);
            debugAccelY.textContent = rawY.toFixed(3);
            debugAccelZ.textContent = rawZ ? rawZ.toFixed(3) : 'null';
            
            const sensitivity = config.gravity / 9.8;
            switch (window.orientation) {
                case 90:  // Landscape, right side down
                    gravityX = rawY * sensitivity;
                    gravityY = rawX * sensitivity;
                    break;
                case -90: // Landscape, left side down
                    gravityX = -rawY * sensitivity;
                    gravityY = -rawX * sensitivity;
                    break;
                case 180: // Upside-down portrait
                    gravityX = -rawX * sensitivity;
                    gravityY = rawY * sensitivity;
                    break;
                case 0:   // Portrait
                default:
                    gravityX = rawX * sensitivity;
                    gravityY = -rawY * sensitivity;
                    break;
            }
            debugGravityX.textContent = gravityX.toFixed(3);
            debugGravityY.textContent = gravityY.toFixed(3);
        }
        
        function handleOrientationEvent(event) {
            if (event.beta === null || event.gamma === null) return;
            const beta = event.beta;
            const gamma = event.gamma;
            
            debugOrientBeta.textContent = beta.toFixed(3);
            debugOrientGamma.textContent = gamma.toFixed(3);

            const DEG_TO_RAD = Math.PI / 180;
            const tiltX = Math.sin(gamma * DEG_TO_RAD) * config.gravity; // Side-to-side
            const tiltY = Math.sin(beta * DEG_TO_RAD) * config.gravity;  // Front-to-back

            switch (window.orientation) {
                case 90:  // Landscape, right side down
                    gravityX = tiltY;
                    gravityY = tiltX;
                    break;
                case -90: // Landscape, left side down
                    gravityX = -tiltY;
                    gravityY = -tiltX;
                    break;
                case 180: // Upside-down portrait
                    gravityX = -tiltX;
                    gravityY = -tiltY;
                    break;
                case 0:   // Portrait
                default:
                    gravityX = tiltX;
                    gravityY = tiltY;
                    break;
            }
            debugGravityX.textContent = gravityX.toFixed(3);
            debugGravityY.textContent = gravityY.toFixed(3);
        }

        function setupGravityControls() {
            const sourceSelector = document.getElementById('gravitySource');
            const gravityLabel = document.getElementById('gravityLabel');
            if (!sourceSelector || !gravityLabel) return;

            sourceSelector.addEventListener('change', (e) => {
                window.removeEventListener('devicemotion', handleMotionEvent);
                window.removeEventListener('deviceorientation', handleOrientationEvent);

                const source = e.target.value;

                if (source === 'fixed') {
                    gravityLabel.childNodes[0].nodeValue = "Gravity ";
                    gravityX = 0;
                    gravityY = config.gravity;
                    debugStatus.textContent = "Fixed (Slider)";
                    debugGravityX.textContent = gravityX.toFixed(3);
                    debugGravityY.textContent = gravityY.toFixed(3);

                } else {
                    gravityLabel.childNodes[0].nodeValue = "Gravity Sensitivity ";
                    requestAndStartMotion(source, sourceSelector);
                }
            });
        }
        
        function requestAndStartMotion(source, sourceSelector) {
            if (!window.isSecureContext) {
                alert('Motion controls require a secure (HTTPS) connection. Please host this file on a secure server.');
                debugStatus.textContent = "Blocked: Insecure context";
                if (sourceSelector) {
                    sourceSelector.value = 'fixed';
                    sourceSelector.dispatchEvent(new Event('change'));
                }
                return;
            }

            const addListeners = () => {
                if (source === 'motion') {
                    window.addEventListener('devicemotion', handleMotionEvent);
                } else if (source === 'orientation') {
                    window.addEventListener('deviceorientation', handleOrientationEvent);
                }
            };
            
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                debugStatus.textContent = "Requesting permission...";
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        debugStatus.textContent = 'Permission: ' + permissionState;
                        if (permissionState === 'granted') {
                            addListeners();
                        } else {
                            if (sourceSelector) {
                                sourceSelector.value = 'fixed';
                                sourceSelector.dispatchEvent(new Event('change'));
                            }
                        }
                    })
                    .catch(err => {
                        debugStatus.textContent = 'Error: ' + err.message;
                        console.error(err);
                    });
            } else {
                debugStatus.textContent = 'Adding listener directly...';
                addListeners();
            }
        }
        
        function initializeMotionAsDefault() {
            const sourceSelector = document.getElementById('gravitySource');
            
            if (!window.isSecureContext) {
                debugStatus.textContent = "Motion API requires HTTPS";
                return;
            }
            
            const hasApiSupport = (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') || ('ondevicemotion' in window);
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            if (hasApiSupport && isTouchDevice) {
                debugStatus.textContent = 'Touch device detected. Attempting to activate motion...';
                sourceSelector.value = 'motion';
                sourceSelector.dispatchEvent(new Event('change'));
            } else if (hasApiSupport && !isTouchDevice) {
                 debugStatus.textContent = 'Motion API found, but not a touch device.';
            } else {
                 debugStatus.textContent = 'No motion support found on this device.';
            }
        }
        
        function updateOrientationDebug() {
            debugOrientation.textContent = window.orientation || 0;
        }

        function setupShapeSelector() {
            const selector = document.getElementById('creatureShape');
            const densityControlDiv = document.getElementById('pointDensityLabel').parentElement;
            const densityLabel = document.getElementById('pointDensityLabel');
            const densityValue = document.getElementById('pointDensityValue');
            const densitySlider = document.getElementById('pointDensity');
            const letterInputContainer = document.getElementById('letterInputContainer');
            const letterInput = document.getElementById('letterInput');
            const numFeetSlider = document.getElementById('numFeet');
            const numFeetValueDisplay = document.getElementById('numFeetValue');

            selector.addEventListener('change', e => {
                config.creatureShape = e.target.value;
                letterInputContainer.style.display = 'none';
                densityControlDiv.style.display = 'block';

                if (config.creatureShape === 'grid') {
                    densityLabel.childNodes[0].nodeValue = "Points / Side ";
                    densitySlider.min = 3;
                    densitySlider.max = 15;
                    if(parseInt(densitySlider.value) > 15) densitySlider.value = 15;
                } else if (config.creatureShape === 'letter') {
                    densityLabel.childNodes[0].nodeValue = "Sampling Density ";
                    densitySlider.min = 2;
                    densitySlider.max = 18;
                    letterInputContainer.style.display = 'block';
                } else if (config.creatureShape === 'bug') {
                    densityControlDiv.style.display = 'none';
                    config.numFeet = 6;
                    numFeetSlider.value = 6;
                    numFeetValueDisplay.textContent = 6;
                } else if (config.creatureShape === 'cross') {
                    densityLabel.childNodes[0].nodeValue = "Arm Length ";
                    densitySlider.min = 5;
                    densitySlider.max = 19;
                }
                densityValue.textContent = densitySlider.value;
                config.pointDensity = parseInt(densitySlider.value);
                saveConfig();
                init();
            });
            letterInput.addEventListener('input', (e) => { 
                config.letterInput = e.target.value.toUpperCase() || 'A';
                saveConfig();
                init(); 
            });
        }

        function setupGaitSelector() { const selector = document.getElementById('gaitPattern'); const seekingFeetControl = document.getElementById('seekingFeetControl'); const waveDelayControl = document.getElementById('waveDelayControl'); const updateGaitControls = () => { config.gaitPattern = selector.value; seekingFeetControl.style.display = (config.gaitPattern === 'sequential') ? 'block' : 'none'; waveDelayControl.style.display = (config.gaitPattern === 'sidewinder') ? 'block' : 'none'; }; selector.addEventListener('change', () => { updateGaitControls(); saveConfig(); init(); }); updateGaitControls(); }

        function setupTendrilControls() {
            setupSlider('numTendrils', 'numTendrilsValue', (val) => { config.numTendrils = val; }, false, true);
            setupSlider('tendrilDensity', 'tendrilDensityValue', (val) => { config.tendrilDensity = val; }, true, true);
            setupSlider('tendrilLength', 'tendrilLengthValue', (val) => { config.tendrilLength = val; }, false, true);
            setupSlider('tendrilQuality', 'tendrilQualityValue', (val) => { config.tendrilQuality = val; }, true, true);
            setupSlider('tendrilStiffness', 'tendrilStiffnessValue', (val) => { config.tendrilStiffness = val; });
            const variationSlider = document.getElementById('tendrilLengthVariation');
            const variationDisplay = document.getElementById('tendrilLengthVariationValue');
            variationSlider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                config.tendrilLengthVariation = value;
                variationDisplay.textContent = (value * 100).toFixed(0) + '%';
                saveConfig();
                init();
            });
            setupCheckbox('feetOnTendrils', (val) => { config.placeFeetOnTendrils = val; }, true);
            const modeSelector = document.getElementById('tendrilPlacementMode'); const countContainer = document.getElementById('tendrilCountContainer'); const densityContainer = document.getElementById('tendrilDensityContainer');
            const updateTendrilMode = () => { config.tendrilPlacementMode = modeSelector.value; countContainer.style.display = (config.tendrilPlacementMode === 'count') ? 'block' : 'none'; densityContainer.style.display = (config.tendrilPlacementMode === 'density') ? 'block' : 'none'; };
            modeSelector.addEventListener('change', () => { updateTendrilMode(); saveConfig(); init(); });
            updateTendrilMode();
        }

        function setupAppearanceControls() {
            const modeSelector = document.getElementById('drawMode');
            const pointContainer = document.getElementById('pointSizeContainer');
            const letterContainer = document.getElementById('letterSizeContainer');

            const updateAppearanceMode = () => {
                config.drawMode = modeSelector.value;
                pointContainer.style.display = (config.drawMode === 'point') ? 'block' : 'none';
                letterContainer.style.display = (config.drawMode === 'letter') ? 'block' : 'none';
            };

            modeSelector.addEventListener('change', () => { updateAppearanceMode(); saveConfig(); });
            setupSlider('pointSize', 'pointSizeValue', (val) => { config.pointBaseSize = val; }, true);
            setupSlider('letterSize', 'letterSizeValue', (val) => { config.letterBaseSize = val; }, false);
            updateAppearanceMode();
        }

        function setupToggleControlsButton() {
            const toggleBtn = document.getElementById('toggleControlsBtn');
            const controlsContainer = document.querySelector('.controls');
            if(toggleBtn && controlsContainer) {
                toggleBtn.addEventListener('click', () => {
                    controlsContainer.classList.toggle('hidden');
                });
            }
        }

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        loadConfig();

        setupSlider('stiffness', 'stiffnessValue', (val) => { config.springStiffness = val; });
        setupSlider('dampingFactor', 'dampingFactorValue', (val) => { config.dampingFactor = val; }, true);
        setupSlider('restLength', 'restLengthValue', (val) => { config.restLengthFactor = val; });
        setupSlider('gravity', 'gravityValue', (val) => {
             config.gravity = val;
             if (document.getElementById('gravitySource').value === 'fixed') {
                gravityY = config.gravity;
                gravityX = 0;
                debugGravityX.textContent = gravityX.toFixed(3);
                debugGravityY.textContent = gravityY.toFixed(3);
             }
        });
        setupSlider('shiverIntensity', 'shiverIntensityValue', (val) => { config.shiverIntensityFactor = val; });
        setupSlider('shiverPropagation', 'shiverPropagationValue', (val) => { config.shiverPropagationFactor = val; });
        setupSlider('footCoordination', 'footCoordinationValue', (val) => { config.footCoordinationFactor = val; });
        setupSlider('targetAttraction', 'targetAttractionValue', (val) => { config.targetAttraction = val; });
        setupSlider('stepCooldown', 'stepCooldownValue', (val) => { config.stepCooldown = val; }, false);
        setupSlider('stepDuration', 'stepDurationValue', (val) => { config.stepDuration = val; }, false);
        setupSlider('stepHeight', 'stepHeightValue', (val) => { config.stepHeight = val; }, false);
        setupSlider('wobbleStrength', 'wobbleStrengthValue', (val) => { config.wobbleStrength = val; }, false);
        setupSlider('pointDensity', 'pointDensityValue', (val) => { config.pointDensity = val; }, false, true);
        setupSlider('numFeet', 'numFeetValue', (val) => { config.numFeet = val; }, false, true);
        setupSlider('numSeekingFeet', 'numSeekingFeetValue', (val) => { config.numSeekingFeet = val; }, false, true);
        setupSlider('waveDelay', 'waveDelayValue', (val) => { config.waveDelay = val; }, false);

        setupCheckbox('enableTendrils', (val) => { config.enableTendrils = val; }, true, [document.getElementById('tendrilControlsContainer')]);
        setupCheckbox('randomPlacement', (val) => { config.useRandomPlacement = val; }, true);

        applyConfigToUI();

        setupShapeSelector();
        setupGaitSelector();
        setupTendrilControls();
        setupAppearanceControls();
        setupToggleControlsButton();
        setupGravityControls();
        setupResetButton();
        setupRandomizeButton();
        setupTitleClick();

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', updateOrientationDebug);
        
        handleResize();
        initializeMotionAsDefault();
        updateOrientationDebug();

        animate();
    </script>
</body>
</html>
