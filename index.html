<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ivraie - Ink on canvas</title>
    <link rel="icon" type="image/png" href="input_file_0.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.2);
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -2;
            background: transparent;
        }

        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -3;
            background: #ffffff;
        }

        #title-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }

        #title-container h1 {
            font-size: 10vw;
            color: rgba(0, 0, 0, 1);
            font-weight: lighter;
            letter-spacing: 0.05em;
            pointer-events: auto;
            cursor: pointer;
            transition: color 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.2);
        }

        #title-container h1:hover {
            color: rgba(0, 0, 0, 0.6);
        }

        #randomizeShortcutBtn {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            pointer-events: auto;
            cursor: pointer;
            background: transparent;
            border: none;
            color: transparent;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 1rem;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }

        #randomizeShortcutBtn:hover {
            background-color: transparent;
        }

        #eraseBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 9;
            border-radius: 50%;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.2);
        }

        #toggleControlsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 11;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background-color: #2d3436;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.5s ease;
        }

        #toggleControlsBtn:hover,
        #toggleControlsBtn.is-visible {
            opacity: 1;
        }

        #toggleControlsBtn.is-visible:hover {
            background-color: #636e72;
        }

        #toggleControlsBtn svg {
            fill: white;
            transition: transform 0.5s ease;
        }

        #toggleControlsBtn:hover svg,
        #toggleControlsBtn.is-visible:hover svg {
            transform: rotate(90deg);
        }

        .main-content {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .controls {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 25px 30px;
            width: 700px;
            column-count: 2;
            column-gap: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .controls.hidden {
            display: none;
        }

        .control-group {
            margin-bottom: 25px;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .control-group h3 {
            font-weight: 600;
            margin-bottom: 15px;
            margin-top: 5px;
            border-bottom: 2px solid #000aa7;
            padding-bottom: 8px;
            color: #000aa7;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #333;
        }

        input[type="checkbox"] {
            opacity: 0;
            position: absolute;
            width: 0;
            height: 0;
        }

        .checkbox-label {
            position: relative;
            padding-left: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            height: 22px;
            -webkit-user-select: none;
            user-select: none;
            color: #333;
        }

        .checkbox-label::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            background-color: #fff;
            transition: all 0.2s;
        }

        .checkbox-label::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 5px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.2s ease-in-out;
        }

        input[type="checkbox"]:checked+.checkbox-label::before {
            border-color: #000aa7;
            background-color: #000aa7;
        }

        input[type="checkbox"]:checked+.checkbox-label::after {
            transform: rotate(45deg) scale(1);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #dfe6e9;
            border-radius: 2px;
            outline: none;
            padding: 0;
            margin: 15px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #000aa7;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            margin-top: -7px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #000aa7;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #f3f4f6;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #000aa7;
            box-shadow: 0 0 0 1px #000aa7;
        }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        #letterInput {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 500;
            color: #1f2937;
            cursor: pointer;
            padding: 15px;
        }

        #letterInputContainer input {
            height: 60px;
        }

        #letterInputContainer {
            margin-top: 15px;
        }

        .value-display {
            float: right;
            font-weight: 500;
            color: #000aa7;
        }

        .controls button {
            padding: 10px 15px;
            background-color: #f3f4f6;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .controls button:hover:not(:disabled) {
            background-color: #e5e7eb;
            border-color: #b9bec4;
        }

        .controls button:focus {
            outline: none;
            border-color: #000aa7;
            box-shadow: 0 0 0 1px #000aa7;
        }

        .controls button:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        .sub-control {
            margin-top: 15px;
            padding-left: 5px;
        }

        footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        footer a {
            pointer-events: auto;
            color: #1c1c2e;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s ease-in-out;
        }

        footer a:hover {
            background-color: black;
            color: white;
            border-color: rgba(0, 0, 0, 0.15);
        }

        #debug-info {
            background: #f4f5f7;
            border: 1px solid #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        #debug-info p {
            margin: 0;
            padding: 0;
        }

        #debug-info span {
            font-weight: bold;
            color: #d63031;
        }

        #gravity-indicator-canvas {
            border: 1px solid #e0e0e0;
            border-radius: 50%;
            background: #f4f5f7;
            display: inline-block;
        }

        @media (orientation: landscape) {
            #title-container h1 {
                font-size: 8vw;
            }
        }

        @media (max-width: 800px) {
            .main-content {
                justify-content: center;
            }

            .controls {
                width: 90vw;
                max-width: 450px;
                column-count: 1;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <button id="eraseBtn" title="Erase all imprints"></button>
    <button id="toggleControlsBtn" title="Toggle Controls">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="28px" height="28px">
            <rect x="11" y="1" width="2" height="22" rx="1" />
            <rect x="11" y="1" width="2" height="22" rx="1" transform="rotate(60 12 12)" />
            <rect x="11" y="1" width="2" height="22" rx="1" transform="rotate(120 12 12)" />
        </svg>
    </button>
    <canvas id="background-canvas"></canvas>
    <canvas id="canvas"></canvas>
    <div id="title-container">
        <h1>Ivraie</h1>
    </div>
    <button id="randomizeShortcutBtn">Randomize</button>

    <main class="main-content">
        <div class="controls hidden">
            <div class="control-group">
                <h3>Structure</h3>
                <div>
                    <label for="creatureShape">Creature Shape</label>
                    <select id="creatureShape">
                        <option value="grid">Grid</option>
                        <option value="letter" selected>Letter</option>
                    </select>
                </div>
                <div id="letterInputContainer" style="display: block;">
                    <label for="letterInput">Enter a Character</label>
                    <input type="text" id="letterInput" value="@" maxlength="1" />
                </div>
                <div>
                    <label for="pointDensity" id="pointDensityLabel">Sampling Density <span id="pointDensityValue"
                            class="value-display">16</span></label>
                    <input type="range" id="pointDensity" min="3" max="20" step="1" value="16" />
                </div>
                <div>
                    <label for="numFeet">Number of Feet <span id="numFeetValue" class="value-display">16</span></label>
                    <input type="range" id="numFeet" min="2" max="16" step="1" value="16" />
                </div>
                <div>
                    <label for="restLength">Rest Length <span id="restLengthValue"
                            class="value-display">0.94</span></label>
                    <input type="range" id="restLength" min="0.0" max="1.5" step="0.01" value="0.94" />
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="randomPlacement" checked />
                    <label for="randomPlacement" class="checkbox-label">Random Foot Placement</label>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="pruneUnfooted" checked />
                    <label for="pruneUnfooted" class="checkbox-label">Prune Unfooted Points</label>
                </div>
                <div id="pruneThresholdContainer">
                    <div class="sub-control">
                        <label for="minPointsPerFoot">Min Points Per Foot <span id="minPointsPerFootValue"
                                class="value-display">20</span></label>
                        <input type="range" id="minPointsPerFoot" min="1" max="50" step="1" value="20" />
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Population</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableCreatureLimit" />
                    <label for="enableCreatureLimit" class="checkbox-label">Enable Creature Limit</label>
                </div>
                <div id="creatureLimitContainer" style="display: none;">
                    <div class="sub-control">
                        <label>Max Creatures <span id="maxCreaturesValue" class="value-display">31</span></label>
                        <input type="range" id="maxCreatures" min="1" max="50" step="1" value="31" />
                    </div>
                    <div class="sub-control">
                        <label>Current Creatures <span id="currentCreaturesValue" class="value-display">0</span></label>
                    </div>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="enablePointLimit" checked />
                    <label for="enablePointLimit" class="checkbox-label">Enable Point Limit</label>
                </div>
                <div id="pointLimitContainer" style="display: block;">
                    <div class="sub-control">
                        <label>Max Points <span id="maxPointsValue" class="value-display">1100</span></label>
                        <input type="range" id="maxPoints" min="100" max="10000" step="100" value="1100" />
                    </div>
                    <div class="sub-control">
                        <label>Current Points <span id="currentPointsValue" class="value-display">0</span></label>
                    </div>
                </div>
                <div class="sub-control">
                    <label for="autoMode">Auto Add Mode</label>
                    <select id="autoMode">
                        <option value="off">Off</option>
                        <option value="respawn">Respawn on Empty</option>
                        <option value="top-up" selected>Constant Top-up</option>
                    </select>
                </div>
                <div class="sub-control">
                    <label for="autoAddDelay">Auto Add Delay (s) <span id="autoAddDelayValue"
                            class="value-display">2.90</span></label>
                    <input type="range" id="autoAddDelay" min="0.0" max="10.0" step="0.01" value="2.9" />
                </div>
                <div class="sub-control">
                    <button id="randomizeBtn">Randomize Creature</button>
                </div>
                <div class="sub-control">
                    <button id="addCreatureBtn" title="Add Another Creature">+ Add Creature</button>
                </div>
            </div>
            <div class="control-group">
                <h3>Appearance</h3>
                <div>
                    <label for="drawMode">Draw Mode</label>
                    <select id="drawMode">
                        <option value="point" selected>Point</option>
                        <option value="letter">Letter</option>
                    </select>
                </div>
                <div id="pointSizeContainer">
                    <label for="pointSize">Point Size <span id="pointSizeValue" class="value-display">1.8</span></label>
                    <input type="range" id="pointSize" min="1" max="15" step="0.1" value="1.8" />
                </div>
                <div class="sub-control">
                    <label for="pointSizeVariation">Size Variation <span id="pointSizeVariationValue"
                            class="value-display">70%</span></label>
                    <input type="range" id="pointSizeVariation" min="0.0" max="1.0" step="0.01" value="0.7" />
                </div>
                <div>
                    <label for="maxLineThickness">Max Line Thickness <span id="maxLineThicknessValue"
                            class="value-display">1.3</span></label>
                    <input type="range" id="maxLineThickness" min="1.0" max="15.0" step="0.1" value="1.3" />
                </div>
                <div class="sub-control">
                    <label for="minShade">Minimum Shade <span id="minShadeValue"
                            class="value-display">0.00</span></label>
                    <input type="range" id="minShade" min="0" max="1.0" step="0.01" value="0.0" />
                </div>
                <div class="sub-control">
                    <label for="shiverEffect">Shiver Visual Effect <span id="shiverEffectValue"
                            class="value-display">1.00</span></label>
                    <input type="range" id="shiverEffect" min="0.0" max="5.0" step="0.01" value="1.0" />
                </div>
                <div id="letterChoiceContainer" style="display: none;">
                    <label for="letterChoice">Choose Letter</label>
                    <select id="letterChoice">
                        <option value="i" selected>i</option>
                        <option value="v">v</option>
                        <option value="r">r</option>
                        <option value="a">a</option>
                        <option value="e">e</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <h3>Printing</h3>
                <div>
                    <label for="printInterval">Continuous Print Interval (ms) <span id="printIntervalValue"
                            class="value-display">250</span></label>
                    <input type="range" id="printInterval" min="50" max="1000" step="10" value="250" />
                </div>
                <div>
                    <label for="imprintShade">Imprint Shade <span id="imprintShadeValue"
                            class="value-display">0.20</span></label>
                    <input type="range" id="imprintShade" min="0.0" max="1.0" step="0.01" value="0.2" />
                </div>
            </div>
            <div class="control-group">
                <h3>Tendrils</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableTendrils" />
                    <label for="enableTendrils" class="checkbox-label">Enable Tendrils</label>
                </div>
                <div id="tendrilControlsContainer">
                    <div id="tendrilCountContainer">
                        <label for="numTendrils">Number of Tendrils <span id="numTendrilsValue"
                                class="value-display">2</span></label>
                        <input type="range" id="numTendrils" min="1" max="5" step="1" value="2" />
                    </div>
                    <div>
                        <label for="tendrilLength">Tendril Length <span id="tendrilLengthValue"
                                class="value-display">10</span></label>
                        <input type="range" id="tendrilLength" min="2" max="30" step="1" value="10" />
                    </div>
                    <div>
                        <label for="tendrilQuality">Tendril Quality <span id="tendrilQualityValue"
                                class="value-display">1.00</span></label>
                        <input type="range" id="tendrilQuality" min="0.1" max="1.0" step="0.01" value="1.0" />
                    </div>
                    <div>
                        <label for="tendrilLengthVariation">Length Variation <span id="tendrilLengthVariationValue"
                                class="value-display">0%</span></label>
                        <input type="range" id="tendrilLengthVariation" min="0" max="1.0" step="0.01" value="0" />
                    </div>
                    <div>
                        <label for="tendrilStiffness">Tendril Stiffness <span id="tendrilStiffnessValue"
                                class="value-display">0.19</span></label>
                        <input type="range" id="tendrilStiffness" min="0.01" max="0.5" step="0.01" value="0.19" />
                    </div>
                    <div class="sub-control">
                        <input type="checkbox" id="shiversOnTendrils" checked />
                        <label for="shiversOnTendrils" class="checkbox-label">Enable Shivers on Tendrils</label>
                    </div>
                    <div class="sub-control">
                        <input type="checkbox" id="feetOnTendrils" checked />
                        <label for="feetOnTendrils" class="checkbox-label">Place Feet on Tendrils</label>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <h3>Motion Physics</h3>
                <div>
                    <label for="stiffness">Body Stiffness <span id="stiffnessValue"
                            class="value-display">0.15</span></label>
                    <input type="range" id="stiffness" min="0.01" max="0.3" step="0.01" value="0.15" />
                </div>
                <div>
                    <label for="damping">Damping <span id="dampingValue" class="value-display">0.141</span></label>
                    <input type="range" id="damping" min="0.001" max="0.2" step="0.001" value="0.141" />
                </div>
                <div>
                    <label for="shiverIntensity">Shiver Contraction <span id="shiverIntensityValue"
                            class="value-display">0.20</span></label>
                    <input type="range" id="shiverIntensity" min="-3.0" max="3.0" step="0.01" value="0.2" />
                </div>
                <div>
                    <label for="shiverPropagation">Shiver Propagation <span id="shiverPropagationValue"
                            class="value-display">0.89</span></label>
                    <input type="range" id="shiverPropagation" min="0" max="1.0" step="0.01" value="0.89" />
                </div>
                <div>
                    <label for="shiverPropagationSpeed">Speed (slower < 1 < faster) <span
                            id="shiverPropagationSpeedValue" class="value-display">5.00</span></label>
                    <input type="range" id="shiverPropagationSpeed" min="-30" max="9" step="1" value="4" />
                </div>
                <div>
                    <label for="shiverDuration">Shiver Duration <span id="shiverDurationValue"
                            class="value-display">0.73</span></label>
                    <input type="range" id="shiverDuration" min="0.1" max="1.0" step="0.01" value="0.73" />
                </div>
            </div>
            <div class="control-group">
                <h3>Gravity & Sensors</h3>
                <div>
                    <label for="gravitySource">Gravity Source</label>
                    <select id="gravitySource">
                        <option value="fixed" selected>Fixed (Slider)</option>
                        <option value="orientation">Device Orientation</option>
                    </select>
                </div>
                <div>
                    <label for="gravity" id="gravityLabel">Gravity Magnitude<span id="gravityValue"
                            class="value-display">0.17</span></label>
                    <input type="range" id="gravity" min="0" max="0.5" step="0.01" value="0.17" />
                </div>
                <div>
                    <label>Gravity Direction</label>
                    <div style="text-align: center; margin-top: 10px;">
                        <canvas id="gravity-indicator-canvas" width="80" height="80"></canvas>
                    </div>
                </div>
                <div id="debug-info-container" style="margin-top: 15px;">
                    <label>Debug Info</label>
                    <div id="debug-info">
                        <p>Status: <span id="debug-status">Fixed (Slider)</span></p>
                        <p>Orientation: <span id="debug-orientation">0</span></p>
                        <p>Gravity X|Y: <span id="debug-gravity-x">0.000</span> | <span
                                id="debug-gravity-y">0.170</span></p>
                    </div>
                </div>
            </div>
            <div class="control-group">

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const backgroundCanvas = document.getElementById('background-canvas');
        const backgroundCtx = backgroundCanvas.getContext('2d');
        const fpsCounterElement = document.getElementById('fpsCounter');

        const gravityIndicatorCanvas = document.getElementById('gravity-indicator-canvas');
        const gravityIndicatorCtx = gravityIndicatorCanvas.getContext('2d');
        const debugStatus = document.getElementById('debug-status');
        const debugOrientation = document.getElementById('debug-orientation');
        const debugGravityX = document.getElementById('debug-gravity-x');
        const debugGravityY = document.getElementById('debug-gravity-y');

        let creatures = [];
        let time = 0;
        let frameCount = 0,
            lastFpsUpdateTime = 0,
            fps = 0;

        let creatureShape = 'letter',
            pointDensity = 16,
            numFeet = 16,
            restLengthFactor = 0.94,
            useRandomPlacement = true;
        let damping = 0.141,
            springStiffness = 0.15,
            shiverIntensityFactor = 0.2,
            shiverPropagationFactor = 0.89,
            shiverEffectMultiplier = 1.0,
            shiverDurationFactor = 0.73,
            shiverPropagationSpeed = 5.0;
        let numSeekingFeet = 3,
            footCoordinationFactor = 0.0,
            stepCooldown = 5,
            stepDuration = 50,
            stepHeight = 74,
            wobbleStrength = 32,
            targetAttraction = 0.05;
        let gaitPattern = 'sequential',
            waveDelay = 5;
        let enableTendrils = false,
            numTendrils = 2,
            tendrilLength = 10,
            tendrilStiffness = 0.19,
            placeFeetOnTendrils = true,
            shiversOnTendrils = true;
        let tendrilQuality = 1.0,
            tendrilLengthVariation = 0;
        let drawMode = 'point',
            pointBaseSize = 1.8,
            letterToDraw = 'i',
            maxLineThickness = 1.3,
            minShade = 0.0,
            imprintShade = 0.2;
        let pointSizeVariation = 0.7;
        let autoAddDelaySeconds = 2.9,
            autoMode = 'top-up';
        let enableBreathing = true,
            breathingRate = 0.009,
            breathingAmplitude = 0.08,
            breathingOffset = 0.9;
        let pruneUnfootedPoints = true,
            minPointsPerFoot = 20;
        let enableProgressiveAppearance = true,
            growthSpeed = 2;
        let enableAging = true,
            agingMode = 'time',
            lifespanSeconds = 11,
            maxFootsteps = 50,
            deathEffect = 'fade';
        let enableCreatureLimit = false,
            maxCreatures = 31,
            enablePointLimit = true,
            maxPoints = 1100;

        let gravity = 0.17;
        let gravityX = 0;
        let gravityY = gravity;

        let printIntervalMs = 250;
        let continuousPrintIntervalId = null;

        let timeSinceEmpty = null;
        let timeSinceLastAutoAdd = null;
        let isInitializingFill = false;
        const INIT_FILL_DELAY = 30;

        const FOOT_STATES = {
            FIXED: 0,
            SEEKING: 1,
            SETTLING: 2
        };
        const FADE_DURATION = 180;

        class Creature {
            constructor(shape, character = 'A') {
                this.points = [];
                this.springs = [];
                this.feet = [];
                this.footPairs = [];
                this.gaitActivationQueue = [];
                this.nextFootToWake = 0;
                this.nextPairToWake = 0;
                this.character = character;
                this.shape = shape;
                this.isDead = false;
                this.stepsTaken = 0;
                this.breathingPhase = Math.random() * Math.PI * 2;
                this.restLengthFactor = restLengthFactor;
                this.propagationAccumulator = 0; // For fractional propagation speed
                if (enableAging) {
                    this.birthTime = time;
                    this.lifespan = (lifespanSeconds * 60) * (0.8 + Math.random() * 0.4);
                    this.maxSteps = maxFootsteps;
                    this.deathTime = null;
                }
                this.init();
            }
            incrementSteps() {
                this.stepsTaken++;
            }
            die() {
                if (this.isDead) return;
                this.printToBackground();
                this.isDead = true;
                this.deathTime = time;
                for (const foot of this.feet) {
                    foot.footState = FOOT_STATES.FIXED;
                }
            }
            printToBackground() {
                this.draw(backgroundCtx, true);
            }
            hasFaded() {
                return this.isDead && deathEffect === 'fade' && (time - this.deathTime) > FADE_DURATION;
            }
            activateFoot(foot) {
                if (this.isDead) return false;
                if (foot && foot.footState === FOOT_STATES.FIXED) {
                    const randomTarget = foot.getRandomEdgeTarget();
                    const coordinatedTarget = foot.getCoordinatedTarget();
                    const finalX = randomTarget.x * (1 - footCoordinationFactor) + coordinatedTarget.x * footCoordinationFactor;
                    const finalY = randomTarget.y * (1 - footCoordinationFactor) + coordinatedTarget.y * footCoordinationFactor;
                    foot.targetPos = {
                        x: finalX,
                        y: finalY
                    };
                    foot.footState = FOOT_STATES.SEEKING;
                    foot.stepStartTime = time;
                    return true;
                }
                return false;
            }
            processGaitQueue() {
                if (this.isDead || this.gaitActivationQueue.length === 0) return;
                for (let i = this.gaitActivationQueue.length - 1; i >= 0; i--) {
                    const item = this.gaitActivationQueue[i];
                    item.delay--;
                    if (item.delay <= 0) {
                        this.activateFoot(item.foot);
                        this.gaitActivationQueue.splice(i, 1);
                    }
                }
            }
            wakeNextMovers(triggeringFoot = null) {
                if (this.isDead) return;
                switch (gaitPattern) {
                    case 'paired':
                        if (this.footPairs.length === 0) return;
                        for (let i = 0; i < this.footPairs.length; i++) {
                            const pairIndex = (this.nextPairToWake + i) % this.footPairs.length;
                            const pair = this.footPairs[pairIndex];
                            if (pair.every(foot => foot.footState === FOOT_STATES.FIXED)) {
                                for (const foot of pair) this.activateFoot(foot);
                                this.nextPairToWake = (pairIndex + 1) % this.footPairs.length;
                                return;
                            }
                        }
                        break;
                    case 'sidewinder':
                        if (this.feet.length === 0 || this.gaitActivationQueue.length > 0) return;
                        let centerX = 0;
                        for (const p of this.points) centerX += p.x;
                        centerX /= this.points.length;
                        const triggerSide = triggeringFoot ? (triggeringFoot.x < centerX ? 'left' : 'right') : 'right';
                        const sideToWake = triggerSide === 'left' ? 'right' : 'left';
                        let feetToWake = this.feet.filter(foot => {
                            const footSide = foot.x < centerX ? 'left' : 'right';
                            return footSide === sideToWake && foot.footState === FOOT_STATES.FIXED;
                        });
                        if (feetToWake.length === 0) {
                            feetToWake = this.feet.filter(foot => foot.footState === FOOT_STATES.FIXED);
                        }
                        feetToWake.sort((a, b) => a.y - b.y);
                        for (let i = 0; i < feetToWake.length; i++) {
                            this.gaitActivationQueue.push({
                                foot: feetToWake[i],
                                delay: i * waveDelay
                            });
                        }
                        break;
                    default:
                        if (this.feet.length === 0) return;
                        for (let i = 0; i < this.feet.length; i++) {
                            this.nextFootToWake = (this.nextFootToWake + 1) % this.feet.length;
                            if (this.activateFoot(this.feet[this.nextFootToWake])) break;
                        }
                        break;
                }
            }
            createGrid(d) {
                const s = Math.min(canvas.width, canvas.height) * .6,
                    t = d > 1 ? s / (d - 1) : s,
                    e = (canvas.width - s) / 2 + Math.random() * 200 - 100,
                    i = (canvas.height - s) / 2 + Math.random() * 200 - 100;
                for (let h = 0; h < d; h++)
                    for (let n = 0; n < d; n++) this.points.push(new Point(e + n * t, i + h * t, this));
                for (let h = 0; h < d; h++)
                    for (let n = 0; n < d; n++) {
                        const r = h * d + n;
                        n < d - 1 && this.springs.push(new Spring(this.points[r], this.points[r + 1], t)), h < d - 1 && this.springs.push(new Spring(this.points[r], this.points[r + d], t))
                    }
                const o = [];
                if (d > 1) {
                    for (let s = 0; s < d; s++) o.push(this.points[s]);
                    for (let s = 1; s < d; s++) o.push(this.points[s * d + d - 1]);
                    for (let s = d - 2; s >= 0; s--) o.push(this.points[(d - 1) * d + s]);
                    for (let s = d - 2; s > 0; s--) o.push(this.points[s * d])
                } else this.points.length > 0 && o.push(this.points[0]);
                return {
                    perimeter: o
                }
            }
            createLetter(t, e) {
                const i = document.createElement("canvas"),
                    h = i.getContext("2d"),
                    n = 200,
                    s = 250;
                i.width = s, i.height = s, h.font = `bold ${n}px 'Segoe UI', sans-serif`, h.textAlign = "center", h.textBaseline = "middle", h.fillText(t, s / 2, s / 2);
                const r = h.getImageData(0, 0, s, s),
                    o = Math.max(1, 20 - e),
                    p = [];
                for (let t = 0; t < s; t += o)
                    for (let e = 0; e < s; e += o) r.data[(t * s + e) * 4 + 3] > 128 && p.push({
                        x: e,
                        y: t
                    });
                if (0 === p.length) return {
                    perimeter: [],
                    springThreshold: 0
                };
                let a = Infinity,
                    l = Infinity,
                    d = -Infinity,
                    c = -Infinity;
                for (const t of p) a = Math.min(a, t.x), l = Math.min(l, t.y), d = Math.max(d, t.x), c = Math.max(c, t.y);
                const g = d - a,
                    u = c - l,
                    m = a + g / 2,
                    f = l + u / 2,
                    v = Math.min(canvas.width, canvas.height) * .7,
                    w = v / Math.max(g, u);
                for (const t of p) {
                    const e = (t.x - m) * w + canvas.width / 2 + Math.random() * 200 - 100,
                        i = (t.y - f) * w + canvas.height / 2 + Math.random() * 200 - 100;
                    this.points.push(new Point(e, i, this))
                }
                return {
                    perimeter: this.points,
                    springThreshold: o * w * 1.5
                }
            }
            createSpringsFromProximity(threshold) {
                if (this.points.length < 2) return;
                const grid = new SpatialHashGrid({
                    width: canvas.width,
                    height: canvas.height
                }, threshold * 1.5);
                for (let i = 0; i < this.points.length; i++) {
                    grid.insert(this.points[i], i);
                }
                for (let i = 0; i < this.points.length; i++) {
                    const p1 = this.points[i];
                    const nearby = grid.query(p1, threshold);
                    for (const item of nearby) {
                        const p2 = item.point;
                        const j = item.index;
                        if (i >= j) continue;
                        const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        if (dist < threshold) {
                            this.springs.push(new Spring(p1, p2, dist));
                        }
                    }
                }
            }
            prunePointsNotConnectedToFeet() {
                if (!pruneUnfootedPoints || this.feet.length === 0 || this.points.length === 0) return;

                const adj = new Map();
                this.points.forEach(p => adj.set(p, []));
                this.springs.forEach(s => {
                    if (adj.has(s.p1) && adj.has(s.p2)) {
                        adj.get(s.p1).push(s.p2);
                        adj.get(s.p2).push(s.p1);
                    }
                });

                const pointsToKeep = new Set();
                const feetToKeep = new Set();

                for (const foot of this.feet) {
                    const component = new Set();
                    const queue = [foot];
                    component.add(foot);
                    let head = 0;

                    while (head < queue.length) {
                        const currentPoint = queue[head++];
                        const neighbors = adj.get(currentPoint) || [];
                        for (const neighbor of neighbors) {
                            if (!component.has(neighbor)) {
                                component.add(neighbor);
                                queue.push(neighbor);
                            }
                        }
                    }

                    if (component.size >= minPointsPerFoot) {
                        component.forEach(p => pointsToKeep.add(p));
                        feetToKeep.add(foot);
                    }
                }

                this.points = this.points.filter(p => pointsToKeep.has(p));
                this.feet = this.feet.filter(f => feetToKeep.has(f));
                this.springs = this.springs.filter(s => pointsToKeep.has(s.p1) && pointsToKeep.has(s.p2));
            }
            init() {
                this.points = [];
                this.springs = [];
                this.feet = [];
                this.footPairs = [];
                this.gaitActivationQueue = [];
                let perimeterRing = [];
                let shapeData;
                switch (this.shape) {
                    case 'letter':
                        shapeData = this.createLetter(this.character, pointDensity);
                        perimeterRing = shapeData.perimeter;
                        this.createSpringsFromProximity(shapeData.springThreshold);
                        break;
                    default:
                        shapeData = this.createGrid(pointDensity);
                        perimeterRing = shapeData.perimeter;
                        break;
                }
                const tendrilTips = [];
                if (enableTendrils && perimeterRing.length > 0) {
                    const hairSegmentLength = 5;
                    let actualNumTendrils = 0;
                    actualNumTendrils = numTendrils;
                    actualNumTendrils = Math.min(actualNumTendrils, perimeterRing.length);
                    const shuffledPerimeter = [...perimeterRing].sort(() => 0.5 - Math.random());
                    const maxSegmentCount = Math.max(2, Math.floor(tendrilLength * tendrilQuality));
                    const minSegmentCount = Math.max(2, Math.floor(maxSegmentCount * (1 - tendrilLengthVariation)));
                    for (let i = 0; i < actualNumTendrils; i++) {
                        const parentPoint = shuffledPerimeter[i];
                        let prevPoint = parentPoint;
                        const lengthRange = maxSegmentCount - minSegmentCount;
                        const thisTendrilLength = minSegmentCount + Math.floor(Math.random() * (lengthRange + 1));
                        for (let j = 0; j < thisTendrilLength; j++) {
                            const newPoint = new Point(prevPoint.x, prevPoint.y + hairSegmentLength, this);
                            newPoint.isHair = true;
                            this.points.push(newPoint);
                            const newSpring = new Spring(prevPoint, newPoint, hairSegmentLength);
                            newSpring.isHair = true;
                            this.springs.push(newSpring);
                            prevPoint = newPoint;
                            if (j === thisTendrilLength - 1) {
                                tendrilTips.push(newPoint);
                            }
                        }
                    }
                }
                let footPlacementPool;
                if (this.shape === 'bug' && shapeData.legTips && shapeData.legTips.length > 0) {
                    footPlacementPool = shapeData.legTips;
                } else if (placeFeetOnTendrils && tendrilTips.length > 0) {
                    footPlacementPool = tendrilTips;
                } else {
                    footPlacementPool = perimeterRing.filter(p => !p.isFoot && this.points.includes(p));
                }
                const actualNumFeet = Math.min(numFeet, footPlacementPool.length);
                if (actualNumFeet > 0) {
                    if (useRandomPlacement) {
                        const shuffledPool = [...footPlacementPool].sort(() => 0.5 - Math.random());
                        for (let i = 0; i < actualNumFeet; i++) {
                            shuffledPool[i].isFoot = true;
                            this.feet.push(shuffledPool[i]);
                        }
                    } else {
                        for (let i = 0; i < actualNumFeet; i++) {
                            const index = Math.floor(i * (footPlacementPool.length / actualNumFeet));
                            footPlacementPool[index].isFoot = true;
                            this.feet.push(footPlacementPool[index]);
                        }
                    }
                }

                this.prunePointsNotConnectedToFeet();

                if (this.feet.length > 0) {
                    this.feet.sort((a, b) => a.x - b.x);
                    let start = 0,
                        end = this.feet.length - 1;
                    while (start <= end) {
                        if (start === end) {
                            this.footPairs.push([this.feet[start]]);
                        } else {
                            this.footPairs.push([this.feet[start], this.feet[end]]);
                        }
                        start++;
                        end--;
                    }
                    this.nextPairToWake = 0;
                    for (const foot of this.feet) {
                        foot.footState = FOOT_STATES.FIXED;
                        foot.setEdgeTarget();
                        foot.x = foot.targetPos.x;
                        foot.y = foot.targetPos.y;
                    }
                    const seekersToStart = gaitPattern === 'sequential' ? numSeekingFeet : 1;
                    for (let i = 0; i < seekersToStart; i++) {
                        this.wakeNextMovers();
                    }
                }

                if (enableProgressiveAppearance && this.feet.length > 0) {
                    const adj = new Map();
                    this.points.forEach(p => adj.set(p, []));
                    this.springs.forEach(s => {
                        adj.get(s.p1).push(s.p2);
                        adj.get(s.p2).push(s.p1);
                    });

                    const queue = [{
                        point: this.feet[0],
                        depth: 0
                    }];
                    const visited = new Set([this.feet[0]]);
                    this.feet[0].birthTime = time;
                    let head = 0;

                    while (head < queue.length) {
                        const {
                            point,
                            depth
                        } = queue[head++];
                        point.birthTime = time + depth * growthSpeed;
                        const neighbors = adj.get(point) || [];
                        for (const neighbor of neighbors) {
                            if (!visited.has(neighbor)) {
                                visited.add(neighbor);
                                queue.push({
                                    point: neighbor,
                                    depth: depth + 1
                                });
                            }
                        }
                    }
                } else {
                    for (const p of this.points) {
                        p.birthTime = time;
                    }
                }
            }
            isOffscreen() {
                if (this.points.length === 0) return true;
                const buffer = 500;
                let minX = Infinity,
                    minY = Infinity,
                    maxX = -Infinity,
                    maxY = -Infinity;
                for (const p of this.points) {
                    minX = Math.min(minX, p.x);
                    minY = Math.min(minY, p.y);
                    maxX = Math.max(maxX, p.x);
                    maxY = Math.max(maxY, p.y);
                }
                return maxX < -buffer || minX > canvas.width + buffer || maxY < -buffer || minY > canvas.height + buffer;
            }
            update() {
                if (enableBreathing && !this.isDead) {
                    this.breathingPhase += breathingRate;
                    this.restLengthFactor = breathingOffset + Math.sin(this.breathingPhase) * breathingAmplitude;
                }
                if (enableAging && !this.isDead) {
                    let shouldDie = false;
                    if (agingMode === 'time') {
                        if (time - this.birthTime > this.lifespan) shouldDie = true;
                    } else {
                        if (this.stepsTaken >= this.maxSteps) shouldDie = true;
                    }
                    if (shouldDie) this.die();
                }
                this.processGaitQueue();
                for (const p of this.points) p.update();
                for (const s of this.springs) s.update();

                this.propagationAccumulator += shiverPropagationSpeed;
                const hopsThisFrame = Math.floor(this.propagationAccumulator);
                if (hopsThisFrame > 0) {
                    this.propagateInternalPulse(hopsThisFrame);
                    this.propagationAccumulator -= hopsThisFrame;
                }
            }
            propagateInternalPulse(numHops) {
                if (this.isDead) return;

                const pulseLoss = shiverPropagationFactor;
                const decayRate = 0.90 + (shiverDurationFactor * 0.09);

                let hopBuffer = new Map();
                this.points.forEach(p => hopBuffer.set(p, p.pulseMagnitude));

                for (let i = 0; i < numHops; i++) {
                    const newPulsesThisHop = new Map();
                    for (const spring of this.springs) {
                        if (!shiversOnTendrils && spring.isHair) continue;

                        const p1 = spring.p1;
                        const p2 = spring.p2;
                        const mag1 = hopBuffer.get(p1);
                        const mag2 = hopBuffer.get(p2);

                        if (mag1 > mag2) {
                            const current = newPulsesThisHop.get(p2) || 0;
                            newPulsesThisHop.set(p2, Math.max(current, mag1 * pulseLoss));
                        } else if (mag2 > mag1) {
                            const current = newPulsesThisHop.get(p1) || 0;
                            newPulsesThisHop.set(p1, Math.max(current, mag2 * pulseLoss));
                        }
                    }

                    let changed = false;
                    newPulsesThisHop.forEach((pulse, point) => {
                        if (pulse > hopBuffer.get(point)) {
                            hopBuffer.set(point, pulse);
                            changed = true;
                        }
                    });
                    if (!changed) break;
                }

                for (const point of this.points) {
                    point.pulseMagnitude = hopBuffer.get(point);
                    point.pulseMagnitude *= decayRate;
                    if (point.pulseMagnitude < 0.01) point.pulseMagnitude = 0;
                }
            }

            // --- THIS IS THE NEW, OPTIMIZED DRAW METHOD ---
            draw(targetCtx, isImprint = false) {
                let fadeAlpha = 1.0;
                if (!isImprint && this.isDead && deathEffect === 'fade') {
                    fadeAlpha = Math.max(0, 1.0 - (time - this.deathTime) / FADE_DURATION);
                    if (fadeAlpha <= 0.01) return; // Don't bother drawing if it's invisible
                }

                // --- BATCHING DATA STRUCTURES ---
                const springBatches = new Map();
                const pointBatches = new Map();
                const letterBatches = new Map();
                const footBatch = [];
                const tendrilBatch = [];

                const baseBodyRadius = pointBaseSize;
                const baseFootRadius = baseBodyRadius + 2.0;

                // --- 1. GATHER & SORT ALL DRAWABLE ELEMENTS (NO DRAWING) ---

                // Gather springs into batches based on their style
                for (const s of this.springs) {
                    if (time < s.p1.birthTime || time < s.p2.birthTime) continue;

                    if (s.isHair) {
                        tendrilBatch.push(s);
                        continue;
                    }

                    const baseIntensity = (s.p1.pulseMagnitude + s.p2.pulseMagnitude) / 2;
                    const shadeIntensity = Math.min(1.0, Math.max(minShade, baseIntensity * shiverEffectMultiplier));

                    // Quantize the shade into 20 levels to create a style key.
                    const styleKey = Math.floor(shadeIntensity * 20);

                    if (!springBatches.has(styleKey)) {
                        springBatches.set(styleKey, []);
                    }
                    springBatches.get(styleKey).push(s);
                }

                // Gather points into batches
                for (const p of this.points) {
                    if (p.isHair || time < p.birthTime) continue;

                    if (p.isFoot) {
                        footBatch.push(p);
                    } else {
                        const baseIntensity = p.pulseMagnitude;
                        const shadeIntensity = Math.min(1.0, Math.max(minShade, baseIntensity * shiverEffectMultiplier));
                        const radiusMultiplier = 1 + (baseIntensity * shiverEffectMultiplier * 0.5);

                        const variation = 1.0 + (p.sizeRandomizer * pointSizeVariation);

                        if (drawMode === 'point') {
                            const finalRadius = Math.max(0.1, baseBodyRadius * radiusMultiplier * variation);
                            // Quantize by shade
                            const styleKey = Math.floor(shadeIntensity * 20);
                            if (!pointBatches.has(styleKey)) pointBatches.set(styleKey, []);
                            pointBatches.get(styleKey).push({
                                point: p,
                                radius: finalRadius
                            });
                        } else if (drawMode === 'letter') {
                            const fontSize = Math.max(1, (baseBodyRadius * 3) * radiusMultiplier * variation);
                            // Quantize by shade AND font size for optimal batching
                            const styleKey = `${Math.floor(shadeIntensity * 20)}_${Math.round(fontSize)}`;
                            if (!letterBatches.has(styleKey)) letterBatches.set(styleKey, []);
                            letterBatches.get(styleKey).push(p);
                        }
                    }
                }


                // --- 2. RENDER THE BATCHES EFFICIENTLY ---

                // Render tendrils (already efficient, but now using the batch)
                if (tendrilBatch.length > 0) {
                    targetCtx.strokeStyle = isImprint ? `rgba(20, 20, 40, ${imprintShade * 0.75})` : `rgba(0, 0, 0, ${0.5 * fadeAlpha})`;
                    targetCtx.lineWidth = 1;
                    targetCtx.beginPath();
                    for (const s of tendrilBatch) {
                        targetCtx.moveTo(s.p1.x, s.p1.y);
                        targetCtx.lineTo(s.p2.x, s.p2.y);
                    }
                    targetCtx.stroke();
                }

                // Render body springs from batches
                const baseLineWidth = Math.max(0.2, 2.8 - (this.points.length / 25));
                springBatches.forEach((springsInBatch, styleKey) => {
                    const shadeIntensity = styleKey / 20; // De-quantize
                    const gray = Math.floor(80 * (1 - shadeIntensity));
                    const lineWidth = Math.min(baseLineWidth + (shadeIntensity * (baseLineWidth * 3.5)), maxLineThickness);

                    targetCtx.strokeStyle = isImprint ? `rgba(${gray}, ${gray}, ${gray}, ${imprintShade})` : `rgba(${gray}, ${gray}, ${gray}, ${fadeAlpha})`;
                    targetCtx.lineWidth = lineWidth;

                    targetCtx.beginPath();
                    for (const s of springsInBatch) {
                        targetCtx.moveTo(s.p1.x, s.p1.y);
                        targetCtx.lineTo(s.p2.x, s.p2.y);
                    }
                    targetCtx.stroke();
                });

                // Render body points (point mode) from batches
                pointBatches.forEach((pointsInBatch, styleKey) => {
                    const shadeIntensity = styleKey / 20;
                    const gray = Math.floor(180 * (1 - shadeIntensity));
                    targetCtx.fillStyle = isImprint ? `rgba(${gray}, ${gray}, ${gray}, ${imprintShade})` : `rgba(${gray}, ${gray}, ${gray}, ${fadeAlpha})`;

                    targetCtx.beginPath();
                    for (const item of pointsInBatch) {
                        targetCtx.moveTo(item.point.x + item.radius, item.point.y); // moveTo is faster than setting x,y in arc
                        targetCtx.arc(item.point.x, item.point.y, item.radius, 0, Math.PI * 2);
                    }
                    targetCtx.fill();
                });

                // Render body points (letter mode) from batches
                letterBatches.forEach((pointsInBatch, styleKey) => {
                    const [shadeKey, fontSizeKey] = styleKey.split('_');
                    const shadeIntensity = parseInt(shadeKey, 10) / 20;
                    const gray = Math.floor(180 * (1 - shadeIntensity));

                    targetCtx.fillStyle = isImprint ? `rgba(${gray}, ${gray}, ${gray}, ${imprintShade})` : `rgba(${gray}, ${gray}, ${gray}, ${fadeAlpha})`;
                    targetCtx.font = `bold ${fontSizeKey}px sans-serif`;

                    // Set these once per batch
                    targetCtx.textAlign = 'center';
                    targetCtx.textBaseline = 'middle';

                    for (const p of pointsInBatch) {
                        targetCtx.fillText(letterToDraw, p.x, p.y);
                    }
                });

                // Render feet (single batch)
                if (footBatch.length > 0) {
                    targetCtx.fillStyle = isImprint ? `rgba(20, 20, 40, ${imprintShade})` : `rgba(0, 0, 0, ${fadeAlpha})`;
                    targetCtx.beginPath();
                    for (const p of footBatch) {
                        targetCtx.moveTo(p.x + baseFootRadius, p.y);
                        targetCtx.arc(p.x, p.y, baseFootRadius, 0, Math.PI * 2);
                    }
                    targetCtx.fill();
                }
            }
        }

        class SpatialHashGrid {
            constructor(bounds, cellSize) {
                this.bounds = bounds;
                this.cellSize = cellSize;
                this.cols = Math.ceil(bounds.width / cellSize);
                this.rows = Math.ceil(bounds.height / cellSize);
                this.grid = new Map();
            }
            _getKey(x, y) {
                return `${x}|${y}`;
            }
            insert(point, index) {
                const cx = Math.floor(point.x / this.cellSize);
                const cy = Math.floor(point.y / this.cellSize);
                const key = this._getKey(cx, cy);
                if (!this.grid.has(key)) {
                    this.grid.set(key, []);
                }
                this.grid.get(key).push({
                    point,
                    index
                });
            }
            query(point, radius) {
                const nearby = [];
                const r = radius / this.cellSize;
                const cx = Math.floor(point.x / this.cellSize);
                const cy = Math.floor(point.y / this.cellSize);
                for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
                    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
                        const key = this._getKey(x, y);
                        if (this.grid.has(key)) {
                            nearby.push(...this.grid.get(key));
                        }
                    }
                }
                return nearby;
            }
        }

        class Point {
            constructor(x, y, creature, isFoot = false) {
                this.x = this.oldX = x;
                this.y = this.oldY = y;
                this.creature = creature;
                this.isFoot = isFoot;
                this.isHair = false;
                this.footState = isFoot ? FOOT_STATES.FIXED : null;
                this.targetPos = {
                    x,
                    y
                };
                this.searchPhase = Math.random() * Math.PI * 2;
                this.mass = 1;
                this.stepStartTime = 0;
                this.settleStartTime = 0;
                this.pulseMagnitude = 0;
                this.birthTime = Infinity;
                this.sizeRandomizer = (Math.random() - 0.5) * 4; // A random value between -2 and 2
            }

            update() {
                if (this.isFoot) {
                    this.updateFoot();
                } else {
                    this.updateBody();
                }
            }

            updateBody() {
                const vX = (this.x - this.oldX) * (1.0 - damping);
                const vY = (this.y - this.oldY) * (1.0 - damping);
                this.oldX = this.x;
                this.oldY = this.y;
                this.x += vX + gravityX;
                this.y += vY + gravityY;
            }

            updateFoot() {
                switch (this.footState) {
                    case FOOT_STATES.FIXED:
                        this.x = this.targetPos.x;
                        this.y = this.targetPos.y;
                        break;
                    case FOOT_STATES.SEEKING:
                        let progress = (time - this.stepStartTime) / stepDuration;
                        if (progress > 1) {
                            this.setEdgeTarget();
                            this.stepStartTime = time;
                            progress = 0;
                        }
                        const wobbleX = Math.sin(time * 0.02 + this.searchPhase) * wobbleStrength;
                        const wobbleY = Math.cos(time * 0.015 + this.searchPhase) * wobbleStrength;
                        const lift = Math.sin(progress * Math.PI) * stepHeight;
                        this.x += (this.targetPos.x - this.x) * targetAttraction + wobbleX + gravityX;
                        this.y += (this.targetPos.y - this.y) * targetAttraction - lift + wobbleY + gravityY;
                        if (this.x <= 1 || this.x >= canvas.width - 1 || this.y <= 1 || this.y >= canvas.height - 1) {
                            this.footState = FOOT_STATES.SETTLING;
                            this.settleStartTime = time;
                            this.targetPos.x = Math.max(0, Math.min(canvas.width, this.x));
                            this.targetPos.y = Math.max(0, Math.min(canvas.height, this.y));
                            this.pulseMagnitude = 1.0;
                        }
                        break;
                    case FOOT_STATES.SETTLING:
                        this.x = this.targetPos.x;
                        this.y = this.targetPos.y;
                        if (time > this.settleStartTime + stepCooldown) {
                            this.footState = FOOT_STATES.FIXED;
                            if (this.creature && !this.creature.isDead) {
                                this.creature.incrementSteps();
                                this.creature.wakeNextMovers(this);
                            }
                        }
                        break;
                }
            }

            applyForce(fx, fy) {
                if (this.footState === FOOT_STATES.FIXED || this.footState === FOOT_STATES.SETTLING) return;
                this.x += fx / this.mass;
                this.y += fy / this.mass;
            }
            getRandomEdgeTarget() {
                const edge = Math.floor(Math.random() * 4);
                switch (edge) {
                    case 0:
                        return {
                            x: Math.random() * canvas.width,
                            y: 0
                        };
                    case 1:
                        return {
                            x: canvas.width,
                            y: Math.random() * canvas.height
                        };
                    case 2:
                        return {
                            x: Math.random() * canvas.width,
                            y: canvas.height
                        };
                    case 3:
                        return {
                            x: 0,
                            y: Math.random() * canvas.height
                        };
                }
            }
            getCoordinatedTarget() {
                let centerX = 0,
                    centerY = 0;
                const creature = this.creature;
                if (creature && creature.points.length > 0) {
                    const bodyPoints = creature.points.filter(p => !p.isHair);
                    if (bodyPoints.length > 0) {
                        for (const p of bodyPoints) {
                            centerX += p.x;
                            centerY += p.y;
                        }
                        centerX /= bodyPoints.length;
                        centerY /= bodyPoints.length;
                    }
                }
                const vectorX = this.targetPos.x - centerX;
                const vectorY = this.targetPos.y - centerY;
                const oppositeX = centerX - vectorX;
                const oppositeY = centerY - vectorY;
                let bestDist = Infinity;
                let bestPoint = {
                    x: 0,
                    y: 0
                };
                for (let x = 0; x <= canvas.width; x += 50) {
                    for (const p of [{
                        x: x,
                        y: 0
                    }, {
                        x: x,
                        y: canvas.height
                    }]) {
                        const d = Math.hypot(p.x - oppositeX, p.y - oppositeY);
                        if (d < bestDist) {
                            bestDist = d;
                            bestPoint = p;
                        }
                    }
                }
                for (let y = 0; y <= canvas.height; y += 50) {
                    for (const p of [{
                        x: 0,
                        y: y
                    }, {
                        x: canvas.width,
                        y: y
                    }]) {
                        const d = Math.hypot(p.x - oppositeX, p.y - oppositeY);
                        if (d < bestDist) {
                            bestDist = d;
                            bestPoint = p;
                        }
                    }
                }
                return bestPoint;
            }
            setEdgeTarget() {
                this.targetPos = this.getRandomEdgeTarget();
            }
        }

        class Spring {
            constructor(p1, p2, baseLength) {
                this.p1 = p1;
                this.p2 = p2;
                this.baseRestLength = baseLength;
                this.isHair = false;
            }
            update() {
                const averagePulse = (this.p1.pulseMagnitude + this.p2.pulseMagnitude) / 2;
                let contraction = 1.0 - (averagePulse * shiverIntensityFactor);
                const currentRestLength = this.baseRestLength * this.p1.creature.restLengthFactor * contraction;
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 0.01) return;
                let stiffness = springStiffness;
                if (this.isHair) {
                    stiffness = tendrilStiffness;
                }
                const forceScalar = (dist - currentRestLength) * stiffness;
                const fx = (dx / dist) * forceScalar;
                const fy = (dy / dist) * forceScalar;
                this.p1.applyForce(fx, fy);
                this.p2.applyForce(-fx, -fy);
            }
        }

        function getCurrentTotalPoints() {
            return creatures.reduce((sum, creature) => sum + creature.points.length, 0);
        }

        function updateCurrentPointsDisplay() {
            const d = document.getElementById('currentPointsValue');
            if (d) d.textContent = getCurrentTotalPoints();
        }

        function updateCreatureCountDisplay() {
            const d = document.getElementById('currentCreaturesValue');
            if (d) d.textContent = creatures.length;
        }

        function updateAddButtonState() {
            const b = document.getElementById('addCreatureBtn');
            if (!b) return;
            b.disabled = (enableCreatureLimit && creatures.length >= maxCreatures) || (enablePointLimit && getCurrentTotalPoints() >= maxPoints);
        }

        function addCreature() {
            if ((enableCreatureLimit && creatures.length >= maxCreatures) || (enablePointLimit && getCurrentTotalPoints() >= maxPoints)) return;
            const char = document.getElementById('letterInput').value || '+';
            creatures.push(new Creature(creatureShape, char));
            if (enablePointLimit && getCurrentTotalPoints() > maxPoints) {
                creatures.pop();
            }
            updateAddButtonState();
            updateCurrentPointsDisplay();
            updateCreatureCountDisplay();
        }

        function resetHistory() {
            if (backgroundCtx) {
                backgroundCtx.clearRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
            }
        }

        function init() {
            creatures = [];
            isInitializingFill = false;
            resetHistory();
            if (autoMode === 'top-up') {
                isInitializingFill = true;
                timeSinceLastAutoAdd = time;
            } else {
                addCreature();
            }
            updateAddButtonState();
            updateCurrentPointsDisplay();
            updateCreatureCountDisplay();
        }

        function update() {
            time++;
            const limitsReached = (enableCreatureLimit && creatures.length >= maxCreatures) || (enablePointLimit && getCurrentTotalPoints() >= maxPoints);
            if (isInitializingFill) {
                if (!limitsReached) {
                    if (time - timeSinceLastAutoAdd > INIT_FILL_DELAY) {
                        addCreature();
                        timeSinceLastAutoAdd = time;
                    }
                } else {
                    isInitializingFill = false;
                }
            } else {
                switch (autoMode) {
                    case 'respawn':
                        if (creatures.length === 0) {
                            if (timeSinceEmpty === null) timeSinceEmpty = time;
                            if (time - timeSinceEmpty > autoAddDelaySeconds * 60) {
                                addCreature();
                                timeSinceEmpty = null;
                            }
                        } else {
                            timeSinceEmpty = null;
                        }
                        break;
                    case 'top-up':
                        if (!limitsReached) {
                            if (timeSinceLastAutoAdd === null) timeSinceLastAutoAdd = time;
                            if (time - timeSinceLastAutoAdd > autoAddDelaySeconds * 60) {
                                addCreature();
                                timeSinceLastAutoAdd = time;
                            }
                        } else {
                            timeSinceLastAutoAdd = time;
                        }
                        break;
                }
            }
            for (let i = creatures.length - 1; i >= 0; i--) {
                const c = creatures[i];
                c.update();
                if (c.isOffscreen() || c.hasFaded()) {
                    creatures.splice(i, 1);
                    updateAddButtonState();
                    updateCurrentPointsDisplay();
                    updateCreatureCountDisplay();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const creature of creatures) {
                creature.draw(ctx);
            }
        }

        function drawGravityIndicator() {
            if (!gravityIndicatorCtx) return;
            const gctx = gravityIndicatorCtx,
                w = gctx.canvas.width,
                h = gctx.canvas.height;
            gctx.clearRect(0, 0, w, h);
            const mag = Math.hypot(gravityX, gravityY);
            if (mag < 0.001) {
                gctx.fillStyle = '#ccc';
                gctx.beginPath();
                gctx.arc(w / 2, h / 2, 2, 0, Math.PI * 2);
                gctx.fill();
                return;
            }
            gctx.save();
            const cX = w / 2,
                cY = h / 2,
                maxLen = (w / 2) * .8,
                maxG = 0.5;
            const normX = gravityX / mag,
                normY = gravityY / mag,
                len = (mag / maxG) * maxLen;
            const endX = cX + normX * len,
                endY = cY + normY * len,
                hL = 8,
                ang = Math.atan2(endY - cY, endX - cX);
            gctx.strokeStyle = '#000aa7';
            gctx.fillStyle = '#000aa7';
            gctx.lineWidth = 2;
            gctx.beginPath();
            gctx.moveTo(cX, cY);
            gctx.lineTo(endX, endY);
            gctx.stroke();
            gctx.beginPath();
            gctx.moveTo(endX, endY);
            gctx.lineTo(endX - hL * Math.cos(ang - Math.PI / 6), endY - hL * Math.sin(ang - Math.PI / 6));
            gctx.lineTo(endX - hL * Math.cos(ang + Math.PI / 6), endY - hL * Math.sin(ang + Math.PI / 6));
            gctx.closePath();
            gctx.fill();
            gctx.restore();
        }

        function handleOrientationEvent(event) {
            if (event.beta === null || event.gamma === null) return;
            const beta = event.beta;
            const gamma = event.gamma;
            const DEG_TO_RAD = Math.PI / 180;

            const tiltX = Math.sin(gamma * DEG_TO_RAD) * gravity;
            const tiltY = Math.sin(beta * DEG_TO_RAD) * gravity;

            switch (window.orientation) {
                case 90:
                    gravityX = tiltY;
                    gravityY = -tiltX;
                    break;
                case -90:
                    gravityX = -tiltY;
                    gravityY = tiltX;
                    break;
                case 180:
                    gravityX = -tiltX;
                    gravityY = -tiltY;
                    break;
                default:
                    gravityX = tiltX;
                    gravityY = tiltY;
                    break;
            }

            debugGravityX.textContent = gravityX.toFixed(3);
            debugGravityY.textContent = gravityY.toFixed(3);
        }

        function requestOrientationPermissions(sourceSelector) {
            if (!window.isSecureContext) {
                alert('Orientation controls require a secure (HTTPS) connection.');
                debugStatus.textContent = "Blocked: Insecure";
                if (sourceSelector) {
                    sourceSelector.value = 'fixed';
                    sourceSelector.dispatchEvent(new Event('change'));
                }
                return;
            }
