<body>

    <button id="eraseBtn" title="Start over"></button>
    <button id="clearImprintsBtn" title="Clear the imprints"></button>
    <button id="printColorBtn" title="Print color"></button>
    <button id="toggleControlsBtn" title="Settings" aria-label="Settings"></button>

    <canvas id="background-canvas"></canvas>
    <canvas id="canvas"></canvas>

    <div id="title-container">
        <h1>Ivraie</h1>
    </div>

    <button id="randomizeShortcutBtn">Randomize</button>

    <main class="main-content">
        <div class="controls hidden">
            <div class="controls-columns">

            <div class="control-group">
                <h3>Structure</h3>
                <div>
                    <label for="creatureShape">Creature Shape</label>
                    <select id="creatureShape">
                        <option value="grid">Grid</option>
                        <option value="letter" selected>Letter</option>
                    </select>
                </div>
                <div id="letterInputContainer" style="display: block;">
                    <label for="letterInput">Enter a Character</label>
                    <input type="text" id="letterInput" value="+" maxlength="1" />
                </div>
                <div>
                    <label for="pointDensity" id="pointDensityLabel">Sampling Density <span id="pointDensityValue"
                            class="value-display">15</span></label>
                    <input type="range" id="pointDensity" min="3" max="20" step="1" value="15" />
                </div>
                <div>
                    <label for="numFeet">Number of Feet <span id="numFeetValue" class="value-display">2</span></label>
                    <input type="range" id="numFeet" min="2" max="16" step="1" value="2" />
                </div>
                <div>
                    <label for="restLength">Rest Length <span id="restLengthValue"
                            class="value-display">0.88</span></label>
                    <input type="range" id="restLength" min="0.0" max="1.5" step="0.01" value="0.8828470773159127" />
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="randomPlacement" checked />
                    <label for="randomPlacement" class="checkbox-label">Random Foot Placement</label>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="pruneUnfooted" checked />
                    <label for="pruneUnfooted" class="checkbox-label">Prune Unfooted Points</label>
                </div>
                <div id="pruneThresholdContainer">
                    <div class="sub-control">
                        <label for="minPointsPerFoot">Min Points Per Foot <span id="minPointsPerFootValue"
                                class="value-display">20</span></label>
                        <input type="range" id="minPointsPerFoot" min="1" max="50" step="1" value="20" />
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Population</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableCreatureLimit" />
                    <label for="enableCreatureLimit" class="checkbox-label">Enable Creature Limit</label>
                </div>
                <div id="creatureLimitContainer" style="display: none;">
                    <div class="sub-control">
                        <label>Max Creatures <span id="maxCreaturesValue" class="value-display">31</span></label>
                        <input type="range" id="maxCreatures" min="1" max="50" step="1" value="31" />
                    </div>
                    <div class="sub-control">
                        <label>Current Creatures <span id="currentCreaturesValue" class="value-display">0</span></label>
                    </div>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="enablePointLimit" checked />
                    <label for="enablePointLimit" class="checkbox-label">Enable Point Limit</label>
                </div>
                <div id="pointLimitContainer" style="display: block;">
                    <div class="sub-control">
                        <label>Max Points <span id="maxPointsValue" class="value-display">400</span></label>
                        <input type="range" id="maxPoints" min="100" max="10000" step="100" value="400" />
                    </div>
                    <div class="sub-control">
                        <label>Current Points <span id="currentPointsValue" class="value-display">0</span></label>
                    </div>
                </div>
                <div class="sub-control">
                    <label for="autoMode">Auto Add Mode</label>
                    <select id="autoMode">
                        <option value="off">Off</option>
                        <option value="respawn">Respawn on Empty</option>
                        <option value="top-up" selected>Constant Top-up</option>
                    </select>
                </div>
                <div class="sub-control">
                    <label for="autoAddDelay">Auto Add Delay (s) <span id="autoAddDelayValue"
                            class="value-display">2.90</span></label>
                    <input type="range" id="autoAddDelay" min="0.0" max="10.0" step="0.01" value="2.9" />
                </div>
                <div class="sub-control">
                    <label for="randomizeModeSelect">Randomize Mode</label>
                    <select id="randomizeModeSelect">
                        <option value="reset" selected>Full Reset</option>
                        <option value="evolve">Evolve Next Creature</option>
                    </select>
                </div>
                <div class="sub-control">
                    <button id="randomizeBtn">Randomize</button>
                </div>
                <div class="sub-control">
                    <button id="addCreatureBtn" title="Add Another Creature">+ Add Creature</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Appearance</h3>
                <div class="color-control">
                    <label for="creatureColor">Creature Color <span id="creatureColorValue"
                            class="value-display">#000000</span></label>
                    <input type="color" id="creatureColor" value="#000000" autocomplete="off" />
                </div>
                <div class="color-control">
                    <label for="shiverColor">Shiver Color <span id="shiverColorValue"
                            class="value-display">#000000</span></label>
                    <input type="color" id="shiverColor" value="#000000" autocomplete="off" />
                </div>
                <div>
                    <label for="drawMode">Draw Mode</label>
                    <select id="drawMode">
                        <option value="point" selected>Point</option>
                        <option value="letter">Letter</option>
                    </select>
                </div>
                <div id="pointSizeContainer">
                    <label for="pointSize">Point Size <span id="pointSizeValue" class="value-display">1.4</span></label>
                    <input type="range" id="pointSize" min="1" max="3.0" step="0.1" value="1.4" />
                </div>
                <div class="sub-control">
                    <label for="pointSizeVariation">Size Variation <span id="pointSizeVariationValue"
                            class="value-display">25%</span></label>
                    <input type="range" id="pointSizeVariation" min="0.0" max="1.0" step="0.01" value="0.25" />
                </div>
                <div>
                    <label for="maxLineThickness">Max Line Thickness <span id="maxLineThicknessValue"
                            class="value-display">1.0</span></label>
                    <input type="range" id="maxLineThickness" min="1.0" max="2.0" step="0.1" value="1.0" />
                </div>
                <div class="sub-control">
                    <label for="minShade">Minimum Shade <span id="minShadeValue"
                            class="value-display">0.00</span></label>
                    <input type="range" id="minShade" min="0" max="1.0" step="0.01" value="0.0" />
                </div>
                <div class="sub-control">
                    <label for="shiverEffect">Shiver Visual Effect <span id="shiverEffectValue"
                            class="value-display">1.00</span></label>
                    <input type="range" id="shiverEffect" min="0.0" max="5.0" step="0.01" value="1.0" />
                </div>
                <div id="letterChoiceContainer" style="display: none;">
                    <label for="letterChoice">Choose Letter</label>
                    <select id="letterChoice">
                        <option value="i" selected>i</option>
                        <option value="v">v</option>
                        <option value="r">r</option>
                        <option value="a">a</option>
                        <option value="e">e</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <h3>Printing</h3>
                <div>
                    <label for="printInterval">Continuous Print Interval (ms) <span id="printIntervalValue"
                            class="value-display">250</span></label>
                    <input type="range" id="printInterval" min="10" max="1000" step="10" value="250" />
                </div>
                <div class="sub-control">
                    <label for="printIntervalRandomness">Interval Variation <span id="printIntervalRandomnessValue"
                            class="value-display">89%</span></label>
                    <input type="range" id="printIntervalRandomness" min="0.0" max="1.0" step="0.01" value="0.89" />
                </div>
                <div class="color-control">
                    <label for="imprintColor">Imprint Color <span id="imprintColorValue"
                            class="value-display">#000000</span></label>
                    <input type="color" id="imprintColor" value="#000000" disabled autocomplete="off" />
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="imprintMatchesCreatureCheck" checked autocomplete="off" />
                    <label for="imprintMatchesCreatureCheck" class="checkbox-label">Imprint Uses Creature Colors</label>
                </div>
                <div>
                    <label for="imprintShade">Imprint Shade <span id="imprintShadeValue"
                            class="value-display">0.39</span></label>
                    <input type="range" id="imprintShade" min="0.0" max="1.0" step="0.01" value="0.39" />
                </div>
                <div style="margin-top: 15px;">
                    <label for="imprintBlendMode">Imprint Blend Mode</label>
                    <select id="imprintBlendMode">
                        <option value="source-over">Normal</option>
                        <option value="lighter">Additive (Lighter)</option>
                        <option value="multiply" selected>Multiply (Darken)</option>
                        <option value="difference">Difference</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="color-burn">Color Burn</option>
                        <option value="color-dodge">Color Dodge</option>
                        <option value="exclusion">Exclusion</option>
                    </select>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="perCreatureImprintCheck" />
                    <label for="perCreatureImprintCheck" class="checkbox-label">Use Creature's Birth Settings</label>
                </div>
            </div>

            <div class="control-group">
                <h3>Tendrils</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableTendrils" />
                    <label for="enableTendrils" class="checkbox-label">Enable Tendrils</label>
                </div>
                <div id="tendrilControlsContainer">
                    <div id="tendrilCountContainer">
                        <label for="numTendrils">Number of Tendrils <span id="numTendrilsValue"
                                class="value-display">5</span></label>
                        <input type="range" id="numTendrils" min="1" max="5" step="1" value="5" />
                    </div>
                    <div>
                        <label for="tendrilLength">Tendril Length <span id="tendrilLengthValue"
                                class="value-display">5</span></label>
                        <input type="range" id="tendrilLength" min="2" max="30" step="1" value="5" />
                    </div>
                    <div>
                        <label for="tendrilQuality">Tendril Quality <span id="tendrilQualityValue"
                                class="value-display">1.00</span></label>
                        <input type="range" id="tendrilQuality" min="0.1" max="1.0" step="0.01" value="1.0" />
                    </div>
                    <div>
                        <label for="tendrilLengthVariation">Length Variation <span id="tendrilLengthVariationValue"
                                class="value-display">0%</span></label>
                        <input type="range" id="tendrilLengthVariation" min="0" max="1.0" step="0.01" value="0" />
                    </div>
                    <div>
                        <label for="tendrilStiffness">Tendril Stiffness <span id="tendrilStiffnessValue"
                                class="value-display">0.10</span></label>
                        <input type="range" id="tendrilStiffness" min="0.01" max="0.5" step="0.01" value="0.1" />
                    </div>
                    <div class="sub-control">
                        <input type="checkbox" id="shiversOnTendrils" checked />
                        <label for="shiversOnTendrils" class="checkbox-label">Enable Shivers on Tendrils</label>
                    </div>
                    <div class="sub-control">
                        <input type="checkbox" id="feetOnTendrils" checked />
                        <label for="feetOnTendrils" class="checkbox-label">Place Feet on Tendrils</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Motion Physics</h3>
                <div>
                    <label for="stiffness">Body Stiffness <span id="stiffnessValue"
                            class="value-display">0.21</span></label>
                    <input type="range" id="stiffness" min="0.01" max="0.3" step="0.01" value="0.21" />
                </div>
                <div>
                    <label for="damping">Damping <span id="dampingValue" class="value-display">0.100</span></label>
                    <input type="range" id="damping" min="0.001" max="0.2" step="0.001" value="0.1" />
                </div>
                <div>
                    <label for="shiverIntensity">Shiver Contraction <span id="shiverIntensityValue"
                            class="value-display">0.50</span></label>
                    <input type="range" id="shiverIntensity" min="-3.0" max="3.0" step="0.01" value="0.5" />
                </div>
                <div>
                    <label for="shiverPropagation">Shiver Propagation <span id="shiverPropagationValue"
                            class="value-display">0.95</span></label>
                    <input type="range" id="shiverPropagation" min="0" max="1.0" step="0.01" value="0.95" />
                </div>
                <div>
                    <label for="shiverPropagationSpeed">Speed (slower < 1 < faster) <span
                            id="shiverPropagationSpeedValue" class="value-display">1.00</span></label>
                    <input type="range" id="shiverPropagationSpeed" min="-30" max="9" step="1" value="0" />
                </div>
                <div>
                    <label for="shiverDuration">Shiver Duration <span id="shiverDurationValue"
                            class="value-display">0.80</span></label>
                    <input type="range" id="shiverDuration" min="0.1" max="1.0" step="0.01" value="0.8" />
                </div>
            </div>

            <div class="control-group">
                <h3>Gravity & Sensors</h3>
                <div>
                    <label for="gravitySource">Gravity Source</label>
                    <select id="gravitySource">
                        <option value="fixed" selected>Fixed (Slider)</option>
                        <option value="orientation">Device Orientation</option>
                    </select>
                </div>
                <div>
                    <label for="gravity" id="gravityLabel">Gravity Magnitude<span id="gravityValue"
                            class="value-display">0.17</span></label>
                    <input type="range" id="gravity" min="0" max="0.5" step="0.01" value="0.17" />
                </div>
                <div>
                    <label>Gravity Direction</label>
                    <div style="text-align: center; margin-top: 10px;">
                        <canvas id="gravity-indicator-canvas" width="80" height="80"></canvas>
                    </div>
                </div>
                <div id="debug-info-container" style="margin-top: 15px;">
                    <label>Debug Info</label>
                    <div id="debug-info">
                        <p>Status: <span id="debug-status">Fixed (Slider)</span></p>
                        <p>Orientation: <span id="debug-orientation">0</span></p>
                        <p>Gravity X|Y: <span id="debug-gravity-x">0.000</span> | <span
                                id="debug-gravity-y">0.170</span></p>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Birth & Death</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableProgressiveAppearance" checked />
                    <label for="enableProgressiveAppearance" class="checkbox-label">Enable Progressive
                        Appearance</label>
                </div>
                <div id="progressiveAppearanceControls">
                    <div class="sub-control">
                        <label>Growth Speed (frames/layer)<span id="growthSpeedValue"
                                class="value-display">2</span></label>
                        <input type="range" id="growthSpeed" min="1" max="10" step="1" value="2" />
                    </div>
                </div>
                <div class="sub-control">
                    <input type="checkbox" id="enableAging" checked />
                    <label for="enableAging" class="checkbox-label">Enable Aging</label>
                </div>
                <div id="agingControlsContainer" style="display: block;">
                    <div class="sub-control">
                        <label for="agingMode">Aging Mode</label>
                        <select id="agingMode">
                            <option value="time" selected>Time</option>
                            <option value="steps">Footsteps</option>
                        </select>
                    </div>
                    <div id="lifespanContainer" class="sub-control">
                        <label>Lifespan (s) <span id="lifespanValue" class="value-display">25</span></label>
                        <input type="range" id="lifespan" min="1" max="120" step="1" value="25" />
                    </div>
                    <div id="maxStepsContainer" class="sub-control" style="display: none;">
                        <label>Max Footsteps <span id="maxStepsValue" class="value-display">50</span></label>
                        <input type="range" id="maxSteps" min="10" max="200" step="5" value="50" />
                    </div>
                    <div class="sub-control">
                        <label for="deathEffect">On Death</label>
                        <select id="deathEffect">
                            <option value="fall">Fall Apart</option>
                            <option value="fade" selected>Fade Away</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Breathing Effect</h3>
                <div class="sub-control">
                    <input type="checkbox" id="enableBreathing" checked />
                    <label for="enableBreathing" class="checkbox-label">Enable Breathing</label>
                </div>
                <div id="breathingControlsContainer">
                    <div>
                        <label for="breathingRate">Breathing Rate <span id="breathingRateValue"
                                class="value-display">0.007</span></label>
                        <input type="range" id="breathingRate" min="0.001" max="0.1" step="0.001" value="0.007" />
                    </div>
                    <div>
                        <label for="breathingAmplitude">Amplitude <span id="breathingAmplitudeValue"
                                class="value-display">0.04</span></label>
                        <input type="range" id="breathingAmplitude" min="0" max="0.5" step="0.01" value="0.04" />
                    </div>
                    <div>
                        <label for="breathingOffset">Base Rest Length <span id="breathingOffsetValue"
                                class="value-display">0.92</span></label>
                        <input type="range" id="breathingOffset" min="0.5" max="1.5" step="0.01" value="0.92" />
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Foot Behavior</h3>
                <div>
                    <label for="gaitPattern">Gait Pattern</label>
                    <select id="gaitPattern">
                        <option value="sequential" selected>Sequential</option>
                        <option value="paired">Paired</option>
                        <option value="sidewinder">Sidewinder</option>
                    </select>
                </div>
                <div id="seekingFeetControl">
                    <label for="numSeekingFeet">Seeking Feet (Sequential) <span id="numSeekingFeetValue"
                            class="value-display">2</span></label>
                    <input type="range" id="numSeekingFeet" min="1" max="6" step="1" value="2" />
                </div>
                <div id="waveDelayControl" style="display: none;">
                    <label for="waveDelay">Wave Delay (frames) <span id="waveDelayValue"
                            class="value-display">5</span></label>
                    <input type="range" id="waveDelay" min="0" max="20" step="1" value="5" />
                </div>
                <div>
                    <label for="footCoordination">Foot Coordination <span id="footCoordinationValue"
                            class="value-display">0.00</span></label>
                    <input type="range" id="footCoordination" min="0.0" max="1.0" step="0.01" value="0.0" />
                </div>
                <div>
                    <label for="stepCooldown">Step Cooldown (frames) <span id="stepCooldownValue"
                            class="value-display">120</span></label>
                    <input type="range" id="stepCooldown" min="0" max="120" step="1" value="120" />
                </div>
                <div>
                    <label for="targetAttraction">Target Attraction <span id="targetAttractionValue"
                            class="value-display">0.05</span></label>
                    <input type="range" id="targetAttraction" min="0.01" max="0.2" step="0.01" value="0.05" />
                </div>
                <div>
                    <label for="stepDuration">Step Duration <span id="stepDurationValue"
                            class="value-display">300</span></label>
                    <input type="range" id="stepDuration" min="50" max="300" step="10" value="300" />
                </div>
                <div>
                    <label for="stepHeight">Step Height <span id="stepHeightValue"
                            class="value-display">68</span></label>
                    <input type="range" id="stepHeight" min="10" max="80" step="1" value="68" />
                </div>
                <div>
                    <label for="wobbleStrength">Seek Wobble <span id="wobbleStrengthValue"
                            class="value-display">36</span></label>
                    <input type="range" id="wobbleStrength" min="0" max="50" step="1" value="36" />
                </div>
            </div>

            <div class="control-group">
                <h3>Export</h3>
                <button id="copyParamsBtn">Copy Parameters</button>
            </div>

            <div class="control-group">
                <h3>Performance</h3>
                <div>
                    <label>Frame Rate
                        <span id="fpsCounter" class="value-display">--</span>
                    </label>
                </div>
            </div>

            </div>
        </div>
    </main>
